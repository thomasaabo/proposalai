<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const EDGE_FN = 'https://fgbehzxrkbqiqrzcwxph.supabase.co/functions/v1/rfp-ai';
const VAULT_STORAGE_KEY = 'proposalai_vault_id';

// ── API Layer ──
async function callAI(apiKey, action, payload) {
  const res = await fetch(EDGE_FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
    body: JSON.stringify({ action, ...payload }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || `API error ${res.status}`);
  }
  return res.json();
}

async function readFileText(file) {
  // PDF: use pdf.js for real text extraction
  if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        pages.push(content.items.map(item => item.str).join(' '));
      }
      return pages.join('\n\n');
    } catch (e) {
      console.error('PDF parse error:', e);
      return '[Could not extract PDF text]';
    }
  }
  // DOCX: extract text from the XML inside the zip
  if (file.name.toLowerCase().endsWith('.docx')) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const zip = await (new Response(new Blob([arrayBuffer]))).arrayBuffer();
      // Simple DOCX text extraction: find document.xml in the zip and strip XML tags
      const bytes = new Uint8Array(zip);
      const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      // Extract readable text between XML tags
      const xmlContent = text.match(/<w:t[^>]*>([^<]*)<\/w:t>/g);
      if (xmlContent) {
        return xmlContent.map(t => t.replace(/<[^>]+>/g, '')).join(' ');
      }
      return '[Could not extract DOCX text — try uploading as PDF or TXT]';
    } catch (e) {
      return '[Could not extract DOCX text — try uploading as PDF or TXT]';
    }
  }
  // Everything else: read as text
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => resolve('[Could not read file]');
    reader.readAsText(file);
  });
}

// ── Spinner ──
function Spinner({ size = 'w-5 h-5' }) {
  return <svg className={`${size} spin text-gold-500`} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeDasharray="32" strokeLinecap="round"/></svg>;
}

// ── Loading Progress Component ──
function LoadingProgress({ estimatedSeconds, messages, onComplete }) {
  const [progress, setProgress] = useState(0);
  const [messageIdx, setMessageIdx] = useState(0);

  useEffect(() => {
    const startTime = Date.now();
    const interval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      let newProgress = Math.floor((elapsed / estimatedSeconds) * 90);

      // Slow down as we approach 90%
      if (newProgress > 70) {
        newProgress = 70 + ((newProgress - 70) * 0.3);
      }
      newProgress = Math.min(newProgress, 89);
      setProgress(newProgress);

      // Cycle through messages
      if (messages.length > 0) {
        const msgIndex = Math.floor((elapsed / estimatedSeconds) * messages.length) % messages.length;
        setMessageIdx(msgIndex);
      }
    }, 200);

    return () => clearInterval(interval);
  }, [estimatedSeconds, messages]);

  return (
    <div className="max-w-2xl mx-auto text-center py-12 fade-in">
      <div className="flex justify-center mb-6">
        <div className="relative w-24 h-24">
          <div className="absolute inset-0 flex items-center justify-center pulse-icon">
            <svg className="w-16 h-16 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/>
              <path d="M13 2v7h7"/>
            </svg>
          </div>
        </div>
      </div>

      <div className="mb-6">
        <p className="text-5xl font-bold text-navy-900">{progress}%</p>
        <p className="text-sm text-navy-500 mt-2 h-6">{messages[messageIdx] || 'Processing...'}</p>
      </div>

      <div className="w-full bg-navy-200 rounded-full h-1">
        <div
          className="bg-gold-400 h-1 rounded-full transition-all duration-200"
          style={{width: `${progress}%`}}
        />
      </div>
    </div>
  );
}

// ── Header ──
function Header({ step, maxStep, onStepClick }) {
  const steps = [{n:1,l:'Upload'},{n:2,l:'Analysis'},{n:3,l:'Questions'},{n:4,l:'Proposal'},{n:5,l:'Package'}];
  return (
    <header className="bg-navy-900 text-white shadow-lg">
      <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 bg-gold-400 rounded-lg flex items-center justify-center text-navy-900 font-bold text-lg">P</div>
          <div>
            <h1 className="text-xl font-bold">ProposalAI</h1>
            <p className="text-navy-300 text-xs">Government RFP Response Engine</p>
          </div>
        </div>
        <nav className="hidden md:flex items-center gap-1">
          {steps.map((s,i) => {
            const visited = s.n <= maxStep;
            const isCurrent = s.n === step;
            const canClick = visited && !isCurrent;
            return (
              <div key={s.n} className="flex items-center">
                <button onClick={() => canClick && onStepClick && onStepClick(s.n)}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-sm transition-all ${isCurrent?'bg-gold-400 text-navy-900 font-semibold':canClick?'bg-navy-700 text-emerald-400 cursor-pointer hover:bg-navy-600':'text-navy-400'}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ${visited && !isCurrent?'bg-emerald-400 text-navy-900':''}`}>{visited && !isCurrent?'✓':s.n}</span>
                  {s.l}
                </button>
                {i<4 && <div className={`w-8 h-0.5 mx-1 ${s.n < maxStep?'bg-emerald-400':'bg-navy-700'}`}/>}
              </div>
            );
          })}
        </nav>
      </div>
    </header>
  );
}

// ── API Key Setup ──
function ApiKeySetup({ onReady }) {
  const [key, setKey] = useState('');
  const [testing, setTesting] = useState(false);
  const [error, setError] = useState('');

  const test = async () => {
    setTesting(true); setError('');
    try {
      await callAI(key.trim(), 'classify', { documents: [{ name:'test.txt', text:'This is a test document.' }] });
      onReady(key.trim());
    } catch (e) {
      setError(e.message || 'Invalid API key');
    }
    setTesting(false);
  };

  return (
    <div className="max-w-lg mx-auto mt-20 fade-in">
      <div className="text-center mb-8">
        <div className="w-16 h-16 bg-gold-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-navy-900 font-bold text-2xl">P</div>
        <h2 className="text-2xl font-bold text-navy-900">Welcome to ProposalAI</h2>
        <p className="text-navy-500 mt-2">Enter your Anthropic API key to get started</p>
      </div>
      <div className="bg-white rounded-2xl border border-navy-100 shadow-sm p-6">
        <label className="block text-sm font-medium text-navy-700 mb-2">Anthropic API Key</label>
        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..."
          className="w-full border border-navy-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:box-shadow: 0 0 0 2px #f0b429; focus:border-transparent"
          onKeyDown={e => e.key === 'Enter' && key.trim() && test()} />
        {error && <p className="text-red-500 text-xs mt-2">{error}</p>}
        <button onClick={test} disabled={!key.trim() || testing}
          className="mt-4 w-full bg-navy-900 hover:bg-navy-800 disabled:bg-navy-300 text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
          {testing ? <><Spinner size="w-4 h-4"/> Verifying...</> : 'Connect & Start'}
        </button>
        <p className="text-xs text-navy-400 mt-3 text-center">Your key is used in-memory only — never stored or sent anywhere except Anthropic's API.</p>
      </div>
    </div>
  );
}

// ── Document Intake ──
function DocumentIntake({ apiKey, initialDocs, onComplete, onDocsChange }) {
  const [docs, setDocs] = useState(initialDocs || []);
  const [classifying, setClassifying] = useState(false);
  const [error, setError] = useState('');
  const [urlInput, setUrlInput] = useState('');
  const [fetching, setFetching] = useState(false);
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef();
  const types = {
    rfp:{l:'RFP Document',c:'bg-blue-100 text-blue-700'},
    rfp_form:{l:'RFP Form',c:'bg-blue-100 text-blue-700'},
    prior_proposal:{l:'Prior Proposal',c:'bg-amber-100 text-amber-700'},
    vendor_capability:{l:'Vendor Capability',c:'bg-purple-100 text-purple-700'},
    vendor_summary:{l:'Vendor Summary',c:'bg-purple-100 text-purple-700'},
    team_bios:{l:'Team Bios',c:'bg-green-100 text-green-700'},
    past_performance:{l:'Past Performance',c:'bg-orange-100 text-orange-700'},
    certifications:{l:'Certifications',c:'bg-teal-100 text-teal-700'},
    supporting:{l:'Supporting Doc',c:'bg-gray-100 text-gray-600'},
    web_content:{l:'Web Content',c:'bg-cyan-100 text-cyan-700'},
  };

  const handleFiles = async (files) => {
    setClassifying(true); setError('');
    try {
      const fileData = await Promise.all(Array.from(files).map(async f => ({
        name: f.name, size: f.size, text: await readFileText(f), file: f
      })));
      const classified = await callAI(apiKey, 'classify', { documents: fileData.map(f=>({name:f.name,text:f.text})) });
      const results = (Array.isArray(classified) ? classified : classified.documents || [classified]).map((c,i) => ({
        id: crypto.randomUUID(), name: fileData[i]?.name || c.name, size: fileData[i]?.size || 0,
        type: c.type || 'supporting', confidence: c.confidence || 0.8, text: fileData[i]?.text || '',
        originalFile: fileData[i]?.file || null,
      }));
      setDocs(prev => [...prev, ...results]);
    } catch (e) { setError(e.message); }
    setClassifying(false);
  };

  const handleFetchUrl = async () => {
    if (!urlInput.trim()) return;
    setFetching(true); setError('');
    try {
      const result = await callAI(apiKey, 'fetch_url', { url: urlInput.trim() });
      if (result.success) {
        const hostname = new URL(urlInput).hostname;
        setDocs(prev => [...prev, {
          id: crypto.randomUUID(),
          name: hostname || 'web_content',
          size: result.text?.length || 0,
          type: 'web_content',
          confidence: 0.9,
          text: result.text || '',
        }]);
        setUrlInput('');
      } else {
        setError('Failed to fetch URL content');
      }
    } catch (e) {
      setError(e.message);
    }
    setFetching(false);
  };

  const hasRFP = docs.some(d => d.type === 'rfp' || d.type === 'rfp_form');
  const isRevisit = initialDocs && initialDocs.length > 0;
  const docsChanged = isRevisit && JSON.stringify(docs.map(d=>d.id).sort()) !== JSON.stringify((initialDocs||[]).map(d=>d.id).sort());

  return (
    <div className="max-w-4xl mx-auto fade-in">
      <div className="text-center mb-8">
        <h2 className="text-3xl font-bold text-navy-900 mb-3">{isRevisit ? 'Your Documents' : 'Upload Your RFP Documents'}</h2>
        <p className="text-navy-500 text-lg max-w-2xl mx-auto">{isRevisit ? 'Add, remove, or re-classify documents. Changes will re-analyze your RFP.' : 'Drop everything in — the RFP, prior winning proposals, company overview, team bios, past performance. AI will classify and analyze.'}</p>
      </div>

      <div onClick={()=>fileRef.current?.click()}
        onDragOver={e => { e.preventDefault(); e.stopPropagation(); setDragging(true); }}
        onDragEnter={e => { e.preventDefault(); e.stopPropagation(); setDragging(true); }}
        onDragLeave={e => { e.preventDefault(); e.stopPropagation(); setDragging(false); }}
        onDrop={e => { e.preventDefault(); e.stopPropagation(); setDragging(false); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); }}
        className={`border-2 border-dashed rounded-2xl p-12 text-center cursor-pointer mb-6 transition-all ${dragging ? 'border-gold-400 bg-gold-400/5 scale-[1.01]' : 'border-navy-200 hover:border-navy-300 hover:bg-navy-50/50 bg-white'}`}>
        <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx,.txt,.csv,.xls,.xlsx" className="hidden"
          onChange={e => e.target.files.length && handleFiles(e.target.files)} />
        {classifying ? (
          <div className="flex flex-col items-center gap-3">
            <Spinner size="w-12 h-12"/>
            <p className="text-navy-700 font-medium">Classifying documents with AI...</p>
          </div>
        ) : dragging ? (
          <div className="flex flex-col items-center gap-3">
            <div className="w-16 h-16 bg-gold-400/20 rounded-2xl flex items-center justify-center text-2xl">+</div>
            <p className="text-navy-700 font-semibold text-lg">Drop files here</p>
          </div>
        ) : (
          <div className="flex flex-col items-center gap-3">
            <div className="w-16 h-16 bg-navy-100 rounded-2xl flex items-center justify-center text-2xl">📄</div>
            <p className="text-navy-700 font-semibold text-lg">Drag & drop or click to upload</p>
            <p className="text-navy-400 text-sm">PDF, DOC, DOCX, TXT, XLS, XLSX</p>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-navy-100 shadow-sm p-6 mb-6">
        <label className="block text-sm font-semibold text-navy-700 mb-3">Or fetch from URL</label>
        <div className="flex gap-2">
          <input type="url" value={urlInput} onChange={e=>setUrlInput(e.target.value)} placeholder="https://example.com/rfp-document"
            className="flex-1 border border-navy-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:box-shadow: 0 0 0 2px #f0b429; focus:border-transparent"
            onKeyDown={e => e.key === 'Enter' && urlInput.trim() && handleFetchUrl()} />
          <button onClick={handleFetchUrl} disabled={!urlInput.trim() || fetching}
            className="bg-navy-900 hover:bg-navy-800 disabled:bg-navy-300 text-white px-6 py-3 rounded-xl font-semibold text-sm flex items-center gap-2">
            {fetching ? <><Spinner size="w-4 h-4"/> Fetching...</> : 'Fetch'}
          </button>
        </div>
      </div>

      {error && <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-sm text-red-700">{error}</div>}

      {docs.length > 0 && (
        <div className="bg-white rounded-2xl border border-navy-100 shadow-sm mb-6">
          <div className="px-6 py-4 border-b border-navy-100 flex justify-between items-center">
            <h3 className="font-semibold text-navy-800">Documents ({docs.length})</h3>
            {!hasRFP && <span className="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full">No RFP detected</span>}
          </div>
          {docs.map((d,i) => (
            <div key={d.id} className="px-6 py-3 flex items-center gap-4 border-b border-navy-50 last:border-0 fade-in">
              <span className={`text-xs px-2 py-1 rounded-full font-medium ${types[d.type]?.c || types.supporting.c}`}>{types[d.type]?.l || d.type}</span>
              <span className="flex-1 text-sm text-navy-800 truncate">{d.name}</span>
              <select value={d.type} onChange={e => setDocs(p=>p.map((x,j)=>j===i?{...x,type:e.target.value}:x))}
                className="text-xs border rounded-lg px-2 py-1 text-navy-600">
                {Object.entries(types).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
              </select>
              <span className="text-xs text-navy-300">{Math.round(d.confidence*100)}%</span>
              <button onClick={()=>setDocs(p=>p.filter((_,j)=>j!==i))} className="text-navy-300 hover:text-red-400">✕</button>
            </div>
          ))}
        </div>
      )}

      {docs.length > 0 && hasRFP && (
        <div className="flex justify-end gap-3">
          {isRevisit && !docsChanged && (
            <button onClick={()=>onComplete(docs, false)} className="bg-navy-200 hover:bg-navy-300 text-navy-700 px-8 py-3 rounded-xl font-semibold text-sm">
              Continue →
            </button>
          )}
          <button onClick={()=>onComplete(docs, docsChanged || !isRevisit)} className={`${docsChanged ? 'bg-gold-400 hover:bg-gold-500 text-navy-900' : 'bg-navy-900 hover:bg-navy-800 text-white'} px-8 py-3 rounded-xl font-semibold text-sm shadow-lg`}>
            {isRevisit && docsChanged ? '🔄 Update & Re-analyze' : isRevisit ? 'Re-analyze →' : 'Analyze RFP →'}
          </button>
        </div>
      )}
    </div>
  );
}

// ── Analysis View ──
function AnalysisView({ apiKey, documents, initialAnalysis, onComplete, onBack }) {
  const [analysis, setAnalysis] = useState(initialAnalysis || null);
  const [error, setError] = useState('');
  const [tab, setTab] = useState('overview');
  const [reanalyzing, setReanalyzing] = useState(false);

  function runAnalysis(cancelled = { current: false }) {
    const rfpDoc = documents.find(d => d.type === 'rfp' || d.type === 'rfp_form');
    const priorDocs = documents.filter(d => d.type === 'prior_proposal');
    const vendorDocs = documents.filter(d => d.type !== 'rfp' && d.type !== 'rfp_form' && d.type !== 'prior_proposal');
    return callAI(apiKey, 'analyze', {
      rfpText: rfpDoc?.text || '',
      vendorTexts: vendorDocs.map(d => ({ name: d.name, type: d.type, text: d.text })),
      priorProposals: priorDocs.map(d => ({ name: d.name, text: d.text })),
    }).then(result => { if (!cancelled.current) setAnalysis(result); })
      .catch(e => { if (!cancelled.current) setError(e.message); });
  }

  useEffect(() => {
    if (analysis !== null) return;
    const cancelled = { current: false };
    runAnalysis(cancelled);
    return () => { cancelled.current = true; };
  }, []);

  // Validation: check if analysis is missing key data
  const analysisGaps = analysis ? [
    ...(!(analysis.evaluationCriteria || []).length ? ['Evaluation criteria not detected'] : []),
    ...(!(analysis.requirements || []).filter(r => r.type === 'mandatory').length ? ['No mandatory requirements found'] : []),
    ...(!(analysis.requirements || []).filter(r => r.type === 'desirable').length ? ['No scored/desirable criteria found'] : []),
    ...(!(analysis.scoringStructure || {}).phases?.length && !(analysis.scoringStructure || {}).scoringRubrics?.length ? ['Scoring rubrics not detected'] : []),
  ] : [];

  function handleReanalyze() {
    setReanalyzing(true);
    setAnalysis(null);
    setError('');
    runAnalysis().finally(() => setReanalyzing(false));
  }

  if (error) return (
    <div className="max-w-2xl mx-auto text-center py-12 fade-in">
      <div className="text-4xl mb-4">⚠️</div>
      <h2 className="text-xl font-bold text-navy-900 mb-2">Analysis Failed</h2>
      <p className="text-navy-500 mb-4">{error}</p>
      <button onClick={onBack} className="text-navy-700 hover:text-navy-900 font-medium">← Back to Upload</button>
    </div>
  );

  if (!analysis) return (
    <div className="max-w-2xl mx-auto">
      <LoadingProgress
        estimatedSeconds={35}
        messages={[
          'Pass 1: Extracting structure & requirements...',
          'Pass 2: Analyzing scoring rubrics & evaluation...',
          'Identifying mandatory vs. scored criteria...',
          'Mapping compliance gates & thresholds...',
          'Cross-referencing with vendor materials...',
          'Building requirements map...',
          'Normalizing & validating results...'
        ]}
      />
    </div>
  );

  const s = analysis.rfpSummary || {};
  const tabs = [{id:'overview',l:'Overview'},{id:'format',l:'Required Format'},{id:'requirements',l:'Requirements'},{id:'compliance',l:'Compliance'}];
  const typeBadge = {mandatory:'bg-red-100 text-red-700',desirable:'bg-blue-100 text-blue-700',informational:'bg-gray-100 text-gray-600'};

  return (
    <div className="max-w-6xl mx-auto fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-2xl font-bold text-navy-900">RFP Analysis Complete</h2>
          <p className="text-navy-500 text-sm mt-1">{s.solicitation || ''} — {s.agency || ''}</p>
        </div>
        <div className="flex gap-3">
          <button onClick={onBack} className="border border-navy-200 text-navy-700 hover:bg-navy-50 px-6 py-2.5 rounded-xl font-semibold text-sm">← Back to Upload</button>
          <button onClick={()=>onComplete(analysis)} className="bg-navy-900 hover:bg-navy-800 text-white px-6 py-2.5 rounded-xl font-semibold text-sm shadow-lg">Continue to Questions →</button>
        </div>
      </div>

      <div className="flex gap-1 mb-6 bg-white rounded-xl p-1 border border-navy-100 shadow-sm">
        {tabs.map(t => <button key={t.id} onClick={()=>setTab(t.id)} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?'bg-navy-900 text-white shadow-md':'text-navy-500 hover:bg-navy-50'}`}>{t.l}</button>)}
      </div>

      {analysisGaps.length > 0 && (
        <div className="mb-4 bg-amber-50 border border-amber-200 rounded-xl p-4 fade-in">
          <div className="flex items-start justify-between">
            <div>
              <p className="text-sm font-semibold text-amber-800">⚠️ Incomplete Analysis Detected</p>
              <p className="text-xs text-amber-700 mt-1">{analysisGaps.join(' · ')}</p>
              <p className="text-xs text-amber-600 mt-1">This can happen with complex or multi-document RFPs. Re-analyzing often fills the gaps.</p>
            </div>
            <button onClick={handleReanalyze} disabled={reanalyzing}
              className="flex-shrink-0 ml-4 bg-amber-500 hover:bg-amber-600 disabled:bg-amber-300 text-white px-4 py-2 rounded-lg text-sm font-medium">
              {reanalyzing ? 'Re-analyzing...' : '🔄 Re-analyze'}
            </button>
          </div>
        </div>
      )}

      {tab === 'overview' && (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div className="lg:col-span-2 bg-white rounded-xl border border-navy-100 shadow-sm p-6">
            <h3 className="font-semibold text-navy-800 mb-4">📋 RFP Summary</h3>
            <h4 className="text-lg font-bold text-navy-900 mb-4">{s.title || 'Untitled'}</h4>

                <div key={k}><span className="text-navy-400 text-xs uppercase">{k}</span><p className="text-navy-800 font-medium">{v}</p></div>

          </div>
          <div className="lg:col-span-3 grid grid-cols-4 gap-4">
            {[{l:'Response Sections',v:(analysis.requiredFormat||[]).length,c:'text-indigo-600'},{l:'Requirements',v:(analysis.requirements||[]).length,c:'text-blue-600'},{l:'Mandatory',v:(analysis.requirements||[]).filter(r=>r.type==='mandatory').length,c:'text-red-600'},{l:'Compliance Items',v:(analysis.complianceChecklist||[]).length,c:'text-yellow-600'}].map(x=>(
              <div key={x.l} className="bg-white rounded-xl border border-navy-100 shadow-sm p-4 text-center">
                <p className={`text-3xl font-bold ${x.c}`}>{x.v}</p><p className="text-sm text-navy-700">{x.l}</p>

      {tab === 'format' && (
        <div className="bg-white rounded-xl border border-navy-100 shadow-sm">
          <div className="px-6 py-4 border-b border-navy-100"><h3 className="font-semibold text-navy-800">Required Response Format</h3><p className="text-xs text-navy-400 mt-1">Your proposal must follow these exact sections as specified in the RFP</p></div>
          {(analysis.requiredFormat||[]).map((sec,i) => (
            <div key={i} className="px-6 py-4 border-b border-navy-50 last:border-0">

                  {sec.pageLimitIfStated && <span className="inline-block text-xs mt-2 px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">Page limit: {sec.pageLimitIfStated}</span>}

              </div>
            </div>
          ))}

      )}

      {tab === 'requirements' && (
        <div className="bg-white rounded-xl border border-navy-100 shadow-sm">
          <div className="px-6 py-4 border-b border-navy-100"><h3 className="font-semibold text-navy-800">Extracted Requirements</h3><p className="text-xs text-navy-400 mt-1">Every requirement stated in the RFP — nothing added, nothing assumed</p></div>
          {(analysis.requirements||[]).map((r,i) => (
            <div key={i} className="px-6 py-4 border-b border-navy-50 last:border-0">
              <div className="flex items-start gap-4">
                <span className="text-xs font-mono text-navy-400 mt-1">{r.id}</span>
                <div className="flex-1">
                  <p className="text-sm text-navy-800">{r.text}</p>

          {(analysis.complianceChecklist||[]).map((c,i) => (

// ── Visual Rich Text Editor (WYSIWYG) ──
function RichTextEditor({ value, onChange }) {
  const editorRef = useRef(null);
  const isInitRef = useRef(false);

  useEffect(() => {
    if (editorRef.current && !isInitRef.current) {
      editorRef.current.innerHTML = value || '';
      isInitRef.current = true;
    }
  }, []);

  function handleInput() {
    if (editorRef.current) onChange(editorRef.current.innerHTML);
  }

  function exec(cmd, val) {
    editorRef.current?.focus();
    document.execCommand(cmd, false, val || null);
    handleInput();
  }

  function isActive(cmd) {
    try { return document.queryCommandState(cmd); } catch { return false; }
  }

  const btnClass = (cmd) => `px-2 py-1 rounded text-xs font-semibold transition-colors ${isActive(cmd) ? 'bg-navy-200 text-navy-800' : 'text-navy-500 hover:bg-navy-100 hover:text-navy-700'}`;

  return (
    <div className="border border-navy-200 rounded-xl overflow-hidden bg-white">
      <div className="flex flex-wrap items-center gap-0.5 px-3 py-2 bg-navy-50 border-b border-navy-200">
        <button type="button" onClick={() => exec('bold')} className={btnClass('bold')} title="Bold"><strong>B</strong></button>
        <button type="button" onClick={() => exec('italic')} className={btnClass('italic')} title="Italic"><em>I</em></button>
        <button type="button" onClick={() => exec('underline')} className={btnClass('underline')} title="Underline"><u>U</u></button>
        <span className="w-px h-5 bg-navy-200 mx-1"/>
        <button type="button" onClick={() => exec('formatBlock', '<h2>')} className="px-2 py-1 rounded text-xs font-semibold text-navy-500 hover:bg-navy-100" title="Heading">H2</button>
        <button type="button" onClick={() => exec('formatBlock', '<h3>')} className="px-2 py-1 rounded text-xs font-semibold text-navy-500 hover:bg-navy-100" title="Subheading">H3</button>
        <button type="button" onClick={() => exec('formatBlock', '<p>')} className="px-2 py-1 rounded text-xs font-semibold text-navy-500 hover:bg-navy-100" title="Paragraph">P</button>
        <span className="w-px h-5 bg-navy-200 mx-1"/>
        <button type="button" onClick={() => exec('insertUnorderedList')} className={btnClass('insertUnorderedList')} title="Bullet list">• List</button>
        <button type="button" onClick={() => exec('insertOrderedList')} className={btnClass('insertOrderedList')} title="Numbered list">1. List</button>
        <span className="w-px h-5 bg-navy-200 mx-1"/>
        <button type="button" onClick={() => exec('removeFormat')} className="px-2 py-1 rounded text-xs text-navy-400 hover:bg-navy-100" title="Clear formatting">✕ Clear</button>
      </div>
      <div ref={editorRef} contentEditable suppressContentEditableWarning
        onInput={handleInput} onBlur={handleInput}
        className="prose px-4 py-3 min-h-[200px] max-h-[500px] overflow-y-auto focus:outline-none"
        style={{resize: 'vertical'}}/>
    </div>
  );
}

// ── Asset Upload Component ──
function AssetUploadArea({ onUpload, label }) {
  const [dragging, setDragging] = useState(false);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef();

  const handleFiles = async (files) => {
    setUploading(true);
    try {
      for (let file of Array.from(files)) {
        const text = await readFileText(file);
        onUpload({ name: file.name, size: file.size, text });
      }
    } catch (e) {
      console.error('Upload error:', e);
    }
    setUploading(false);
  };

  return (
    <div className={`asset-upload-area ${dragging ? 'dragging' : ''}`}
      onClick={() => fileRef.current?.click()}
      onDragOver={e => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={e => { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); }}>
      <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx,.txt" className="hidden"
        onChange={e => e.target.files.length && handleFiles(e.target.files)} />
      {uploading ? (
        <div className="flex items-center justify-center gap-2"><Spinner size="w-5 h-5"/><span className="text-sm text-navy-600">Uploading...</span></div>
      ) : (
        <>
          <div className="text-2xl mb-2">📎</div>
          <p className="text-sm font-medium text-navy-700">{label}</p>
          <p className="text-xs text-navy-500 mt-1">Click or drag files to upload</p>
        </>
      )}
    </div>
  );
}

// ── Form Field Component ──
function FormField({ field, value, onChange }) {
  const baseClass = 'form-field-input w-full';

  if (field.fieldType === 'textarea') {
    return (
      <div className="mb-4">
        <label className="form-field-label">{field.fieldName} {field.required && <span className="form-field-required">*</span>}</label>
        <textarea value={value || ''} onChange={e => onChange(e.target.value)} placeholder={field.hint}
          className={`${baseClass} h-24 resize-none`} />
      </div>
    );
  }

  if (field.fieldType === 'checkbox') {
    return (
      <div className="mb-4">
        <label className="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked={value || false} onChange={e => onChange(e.target.checked)} className="w-4 h-4"/>
          <span className="text-sm text-navy-700">{field.fieldName}</span>
          {field.required && <span className="form-field-required">*</span>}
        </label>
      </div>
    );
  }

  if (field.fieldType === 'signature') {
    return (
      <div className="mb-4">
        <label className="form-field-label">{field.fieldName} {field.required && <span className="form-field-required">*</span>}</label>
        <input type="text" value={value || ''} onChange={e => onChange(e.target.value)} placeholder={field.hint}
          className={`${baseClass} italic text-gray-400`} />
      </div>
    );
  }

  if (field.fieldType === 'date') {
    return (
      <div className="mb-4">
        <label className="form-field-label">{field.fieldName} {field.required && <span className="form-field-required">*</span>}</label>
        <input type="date" value={value || ''} onChange={e => onChange(e.target.value)} className={baseClass} />
      </div>
    );
  }

  // text input (default)
  return (
    <div className="mb-4">
      <label className="form-field-label">{field.fieldName} {field.required && <span className="form-field-required">*</span>}</label>
      <input type="text" value={value || ''} onChange={e => onChange(e.target.value)} placeholder={field.hint} className={baseClass} />
    </div>
  );
}

// ── Questions Flow ──
function QuestionsFlow({ apiKey, analysis, documents = [], priorProposals = [], vaultSnippets = [], initialQuestions, onComplete, onBack }) {
  // Single source of truth: null=loading, []=empty, [...]= ready
  const [questions, setQuestions] = useState(initialQuestions || null);
  const [idx, setIdx] = useState(0);
  const [error, setError] = useState('');
  const [supplementalDocs, setSupplementalDocs] = useState([]);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (questions !== null) return; // Already have data from previous visit
    let cancelled = false;
    // Send ALL vendor docs with generous limits so AI can draft answers properly
    const vendorContent = documents
      .filter(d => d.type !== 'rfp' && d.type !== 'rfp_form' && d.type !== 'prior_proposal')
      .map(d => ({ name: d.name, type: d.type, text: (d.text || '').substring(0, 10000) }));
    callAI(apiKey, 'questions', {
      analysis,
      priorProposals: priorProposals.map(d => ({ name: d.name, text: (d.text || '').substring(0, 8000) })),
      allContent: vendorContent,
      vaultSnippets: vaultSnippets.slice(0, 15)
    })
      .then(data => {
        if (cancelled) return;
        const qs = Array.isArray(data) ? data : (data && data.questions) || [];
        // Process questions: auto-match uploaded docs to asset questions
        setQuestions(qs.map(q => {
          const isAsset = String(q.questionType || 'data') === 'asset';
          const matchedName = q.matchedDocName ? String(q.matchedDocName) : '';
          // If AI matched a doc to this asset question, auto-attach it
          const autoAttached = isAsset && matchedName && documents.some(d => d.name === matchedName);
          return {
            question: String(q.question || ''),
            questionType: String(q.questionType || 'data'),
            priority: String(q.priority || 'medium'),
            hint: q.hint ? String(q.hint) : '',
            draftAnswer: q.draftAnswer ? String(q.draftAnswer) : '',
            draftSources: Array.isArray(q.draftSources) ? q.draftSources.map(String) : [],
            answer: q.answer ? String(q.answer) : '',
            assetAttached: false, // Not confirmed until user clicks
            assetName: autoAttached ? matchedName : '',
            autoMatched: autoAttached,
            formData: q.questionType === 'form' ? {} : undefined
          };
        }));
      })
      .catch(e => {
        if (!cancelled) setError(e.message);
      });
    return () => { cancelled = true; };
  }, []);

  // Derive loading from questions state
  const loading = questions === null && !error;

  if (loading) return (
    <div className="max-w-2xl mx-auto">
      <LoadingProgress
        estimatedSeconds={45}
        messages={['Analyzing RFP questions...','Mapping to vendor materials...','Identifying gaps...','Generating targeted questions...','Preparing draft answers...','Finalizing question flow...']}
      />
    </div>
  );

  if (error) return (
    <div className="text-center py-12">
      <p className="text-red-500 mb-4">{error}</p>
      <button onClick={onBack} className="text-navy-700 hover:text-navy-900 font-medium">← Back to Analysis</button>
    </div>
  );

  if (!questions || questions.length === 0) return (
    <div className="text-center py-12">
      <p className="text-navy-500 mb-4">No questions generated.</p>
      <button onClick={()=>onComplete([])} className="bg-navy-900 text-white px-6 py-2 rounded-lg">Skip to Proposal →</button>
    </div>
  );

  const q = questions[idx] || questions[0];
  const safeIdx = questions[idx] ? idx : 0;

  const answered = questions.reduce((count, x) => {
    if (x.questionType === 'form') return count + (x.formData && Object.keys(x.formData).length > 0 ? 1 : 0);
    if (x.questionType === 'asset') return count + (x.assetAttached ? 1 : 0);
    return count + (x.answer && x.answer.trim() ? 1 : 0);
  }, 0);

  const prioColor = {critical:'bg-red-100 text-red-700',high:'bg-orange-100 text-orange-700',medium:'bg-blue-100 text-blue-700'};

  function handleAnswerChange(v) {
    setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, answer: v } : x));
  }

  function handleAssetUpload(asset) {
    setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, assetAttached: true, assetName: asset.name } : x));
  }

  function handleFormFieldChange(fieldName, value) {
    setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, formData: { ...x.formData, [fieldName]: value } } : x));
  }

  function handleUseDraft() {
    if (q.draftAnswer) {
      setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, answer: q.draftAnswer } : x));
    }
  }

  async function handleAddSupplementalDoc(files) {
    try {
      for (const file of Array.from(files)) {
        const text = await readFileText(file);
        setSupplementalDocs(prev => [...prev, { name: file.name, text, type: 'data' }]);
      }
    } catch (e) {
      console.error('Error reading supplemental doc:', e);
    }
  }

  // Accept all AI suggestions in one click
  function handleAcceptAll() {
    setQuestions(prev => prev.map(x => {
      const updated = { ...x };
      // Accept draft answers for text/data questions
      if (x.draftAnswer && (!x.answer || !x.answer.trim()) && x.questionType !== 'form' && x.questionType !== 'asset') {
        updated.answer = x.draftAnswer;
      }
      // Confirm auto-matched assets
      if (x.autoMatched && !x.assetAttached) {
        updated.assetAttached = true;
      }
      return updated;
    }));
  }

  // Count how many suggestions are available to accept
  const pendingSuggestions = questions.reduce((count, x) => {
    if (x.draftAnswer && (!x.answer || !x.answer.trim()) && x.questionType !== 'form' && x.questionType !== 'asset') count++;
    if (x.autoMatched && !x.assetAttached) count++;
    return count;
  }, 0);

  return (
    <div className="max-w-4xl mx-auto fade-in">
      <div className="flex justify-between items-start mb-6">
        <div><h2 className="text-2xl font-bold text-navy-900">Clarifying Questions</h2><p className="text-navy-500 text-sm mt-1">Fill the gaps between RFP requirements and your materials</p></div>
        <div className="flex items-center gap-3">
          {pendingSuggestions > 0 && (
            <button onClick={handleAcceptAll} className="bg-gold-400 hover:bg-gold-500 text-navy-900 px-4 py-2 rounded-xl font-semibold text-sm shadow-sm transition-colors">
              Accept All Suggestions ({pendingSuggestions})
            </button>
          )}
          <div className="text-right"><p className="text-sm font-medium text-navy-700">{answered}/{questions.length} answered</p></div>
        </div>
      </div>

      <div className="flex gap-1.5 mb-6">
        {questions.map((x,i)=>{
          const filled = x.questionType === 'form' ? (x.formData && Object.keys(x.formData).length > 0)
            : x.questionType === 'asset' ? x.assetAttached
            : Boolean(x.answer && x.answer.trim());
          return <button key={i} onClick={()=>setIdx(i)} className={`h-2 rounded-full transition-all ${i===safeIdx?'w-8 bg-gold-400':filled?'w-2 bg-emerald-400':'w-2 bg-navy-300'}`}/>
        })}
      </div>

      {supplementalDocs.length > 0 && (
        <div className="bg-navy-50 rounded-xl p-4 mb-6">
          <p className="text-xs font-semibold text-navy-600 mb-2">📚 Supplemental Content ({supplementalDocs.length} docs)</p>
          <div className="flex flex-wrap gap-2">
            {supplementalDocs.map((d, i) => (
              <div key={i} className="text-xs bg-white px-2 py-1 rounded-full text-navy-700 flex items-center gap-1">
                {d.name}
                <button onClick={() => setSupplementalDocs(p => p.filter((_, j) => j !== i))} className="text-navy-400 hover:text-red-400">✕</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl border border-navy-100 shadow-sm mb-6" key={safeIdx}>
        <div className="px-8 py-4 border-b border-navy-50 flex items-center gap-3">
          <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${prioColor[q.priority]||''}`}>{q.priority || 'normal'}</span>
          <span className="text-xs text-navy-400 bg-navy-50 px-2 py-0.5 rounded-full">{q.questionType || 'text'}</span>
          <span className="text-xs text-navy-300 ml-auto">{safeIdx+1} of {questions.length}</span>
        </div>
        <div className="px-8 py-6">
          <p className="text-navy-800 text-lg leading-relaxed mb-4">{q.question}</p>
          {q.hint ? <div className="bg-gold-400/10 border border-gold-400/20 rounded-xl p-4 mb-4"><p className="text-sm text-navy-600">💡 {q.hint}</p></div> : null}

          {q.questionType === 'form' ? (
            <div className="mb-4">
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4">
                <p className="text-sm text-amber-800 font-medium">PDF Form Required</p>
                <p className="text-xs text-amber-700 mt-1">This form must be completed in its original PDF format. Use the fields below to draft your responses, then fill them into the actual PDF before final submission.</p>
              </div>
              <div className="bg-navy-50 rounded-xl p-6">
                  {(analysis.requiredForms || []).length > 0 ? (
                    analysis.requiredForms[0]?.fields?.map((field, fi) => (
                      <FormField key={fi} field={field} value={q.formData ? q.formData[field.fieldName] : ''} onChange={v => handleFormFieldChange(field.fieldName, v)} />
                    ))
                  ) : (
                    <p className="text-sm text-navy-600">No form fields available</p>
                  )}
              </div>
            </div>
          ) : q.questionType === 'asset' ? (
            <div className="mb-4">
              {q.autoMatched && q.assetAttached ? (
                <div className="bg-emerald-100 border-2 border-emerald-400 rounded-xl p-4 mb-3">
                  <p className="text-sm font-bold text-emerald-900">✅ Matched: "{q.assetName}"</p>
                  <p className="text-xs text-emerald-700 mt-1">This uploaded document has been confirmed for this requirement.</p>
                  <button onClick={() => setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, assetAttached: false } : x))} className="text-xs text-emerald-600 hover:text-emerald-800 font-medium mt-2">Undo confirmation</button>
                </div>
              ) : q.autoMatched && !q.assetAttached ? (
                <div className="bg-gold-400/10 border border-gold-400/30 rounded-xl p-4 mb-3">
                  <p className="text-sm font-medium text-navy-800">📎 Suggested match from your uploads</p>
                  <p className="text-sm text-navy-600 mt-1">"{q.assetName}" may satisfy this requirement.</p>
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, assetAttached: true } : x))} className="text-xs bg-navy-900 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-navy-800">Confirm Match</button>
                    <button onClick={() => setQuestions(prev => prev.map((x, i) => i === safeIdx ? { ...x, autoMatched: false, assetName: '' } : x))} className="text-xs border border-navy-200 text-navy-600 px-3 py-1.5 rounded-lg font-medium hover:bg-navy-50">Upload Different</button>
                  </div>
                </div>
              ) : null}
              {!q.autoMatched ? <AssetUploadArea onUpload={handleAssetUpload} label={q.question} /> : null}
              {q.assetAttached && !q.autoMatched ? <p className="text-sm text-emerald-600 mt-2">✓ Asset attached: {q.assetName}</p> : null}
            </div>
          ) : (
            <>
              <textarea value={q.answer || ''} onChange={e => handleAnswerChange(e.target.value)} placeholder="Type your answer..."
                className="w-full border border-navy-200 rounded-xl px-4 py-3 text-sm min-h-[120px] focus:outline-none resize-y"
                style={{boxShadow: 'none', fontFamily: 'Inter, -apple-system, sans-serif'}} />
              {q.draftAnswer ? (
                <div className="mt-4 p-4 bg-navy-50 rounded-xl border border-navy-100">
                  <div className="flex justify-between items-start mb-2">
                    <p className="text-sm font-medium text-navy-700">AI Draft Available</p>
                    {!(q.answer && q.answer.trim()) ? <button onClick={handleUseDraft} className="text-xs bg-gold-400 text-navy-900 px-2 py-1 rounded font-medium hover:bg-gold-500">Use Draft</button> : null}
                  </div>
                  <p className="text-sm text-navy-600 mb-3">{q.draftAnswer}</p>
                  {q.draftSources && q.draftSources.length > 0 ? (
                    <div className="flex flex-wrap gap-1">
                      {q.draftSources.map((src, si) => <span key={si} className="source-tag">{src}</span>)}
                    </div>
                  ) : null}
                </div>
              ) : null}
              {q.questionType === 'data' ? (
                <div className="mt-4">
                  <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="text-sm text-navy-700 hover:text-navy-900 font-medium">+ Add URL or Document</button>
                  <input ref={fileInputRef} type="file" multiple accept=".pdf,.doc,.docx,.txt" className="hidden"
                    onChange={e => e.target.files && e.target.files.length && handleAddSupplementalDoc(e.target.files)} />
                </div>
              ) : null}
            </>
          )}
        </div>
        <div className="px-8 py-4 bg-navy-50/50 flex justify-between">
          <button onClick={()=>setIdx(Math.max(0,safeIdx-1))} disabled={safeIdx===0} className="text-sm text-navy-500 disabled:opacity-30">← Previous</button>
          <button onClick={()=>setIdx(Math.min(questions.length-1,safeIdx+1))} disabled={safeIdx===questions.length-1} className="text-sm text-navy-500 disabled:opacity-30">Next →</button>
        </div>
      </div>

      <div className="flex justify-between">
        <button onClick={onBack} className="border border-navy-200 text-navy-700 hover:bg-navy-50 px-6 py-2.5 rounded-xl font-semibold text-sm">← Back to Analysis</button>
        <button onClick={() => onComplete(questions)} className="bg-navy-900 hover:bg-navy-800 text-white px-8 py-3 rounded-xl font-semibold text-sm shadow-lg">Generate Proposal Draft →</button>
      </div>
    </div>
  );
}

// ── Proposal Section Editor ──
function SectionEditor({ section, onUpdate, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) {
  const [editing, setEditing] = useState(false);
  const [editTitle, setEditTitle] = useState(section.title);
  const [editContent, setEditContent] = useState(section.content || '');
  const [expanded, setExpanded] = useState(false);

  const sugIcon = {enhancement:'📈',data_point:'📊',compliance:'⚠️',risk:'🔴',critical:'🚨'};

  function saveEdits() {
    onUpdate({ ...section, title: editTitle, content: editContent });
    setEditing(false);
  }

  function cancelEdits() {
    setEditTitle(section.title);
    setEditContent(section.content || '');
    setEditing(false);
  }

  return (
    <div className="bg-white rounded-xl border border-navy-100 shadow-sm">
      <div className="flex items-center">
        <button onClick={() => setExpanded(!expanded)} className="flex-1 px-6 py-4 flex items-center gap-4 text-left hover:bg-navy-50/50">
          <span className="text-lg">📄</span>
          <div className="flex-1">
            <h3 className="font-semibold text-navy-800">{section.title}</h3>
            {section.volume ? <p className="text-xs text-navy-400">{section.volume}</p> : null}
          </div>
          {section.suggestions && section.suggestions.length > 0 ? <span className="text-xs bg-gold-400/10 text-gold-600 px-2 py-1 rounded-full">✨ {section.suggestions.length}</span> : null}
          <span className="text-navy-400">{expanded ? '▲' : '▼'}</span>
        </button>
        <div className="flex items-center gap-1 pr-4">
          {!isFirst ? <button onClick={onMoveUp} className="p-1 text-navy-400 hover:text-navy-700" title="Move up">↑</button> : null}
          {!isLast ? <button onClick={onMoveDown} className="p-1 text-navy-400 hover:text-navy-700" title="Move down">↓</button> : null}
        </div>
      </div>

      <div className="border-t border-navy-100 print-section-body" style={{display: expanded ? 'block' : 'none'}}>
          {editing ? (
            <div className="px-6 py-4">
              <label className="block text-xs font-semibold text-navy-600 mb-1">Section Title</label>
              <input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)}
                className="w-full border border-navy-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none" style={{boxShadow: 'none'}} />
              <label className="block text-xs font-semibold text-navy-600 mb-1">Content</label>
              <RichTextEditor value={editContent} onChange={setEditContent} />
              <div className="flex gap-2 mt-3" data-print="hide">
                <button onClick={saveEdits} className="bg-navy-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-navy-800">Save</button>
                <button onClick={cancelEdits} className="border border-navy-200 text-navy-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-navy-50">Cancel</button>
                <button onClick={onDelete} className="ml-auto text-red-500 hover:text-red-700 text-sm font-medium px-4 py-2">Delete Section</button>
              </div>
            </div>
          ) : (
            <>
              <div className="px-8 py-6 prose" dangerouslySetInnerHTML={{__html: section.content}} />
              <div className="px-6 py-3 border-t border-navy-50 flex gap-2" data-print="hide">
                <button onClick={() => setEditing(true)} className="text-xs text-navy-500 hover:text-navy-800 font-medium px-3 py-1.5 rounded-lg hover:bg-navy-50">✏️ Edit Section</button>
              </div>
            </>
          )}
          {!editing && section.suggestions && section.suggestions.length > 0 ? (
            <div className="px-6 py-4 bg-navy-50/50 border-t border-navy-100" data-print="hide">
              <p className="text-sm font-semibold text-navy-700 mb-3">✨ AI Suggestions</p>
              {section.suggestions.map((s, i) => (
                <div key={i} className="flex items-start gap-2 p-3 rounded-lg bg-white border border-navy-100 mb-2">
                  <span>{sugIcon[s.type] || '💡'}</span>
                  <p className="text-sm text-navy-700">{s.text}</p>
                </div>
              ))}
            </div>
          ) : null}
        </div>
    </div>
  );
}

// ── Proposal View ──
function ProposalView({ apiKey, analysis, answers, priorProposals = [], allDocuments = [], initialProposal, onProposalReady, onBack, onAssemble }) {
  const [proposal, setProposal] = useState(initialProposal || null);
  const [error, setError] = useState('');
  const [copied, setCopied] = useState(false);
  const [adding, setAdding] = useState(false);
  const [newTitle, setNewTitle] = useState('');

  useEffect(() => {
    if (proposal !== null) return; // Already have data from previous visit
    let cancelled = false;
    callAI(apiKey, 'proposal', { analysis, answers, priorProposals: priorProposals.map(d => ({ name: d.name, text: (d.text || '').substring(0, 12000) })) })
      .then(data => {
        if (cancelled) return;
        setProposal(data);
        if (onProposalReady) onProposalReady(data);
      })
      .catch(e => { if (!cancelled) setError(e.message); });
    return () => { cancelled = true; };
  }, []);

  // Sync proposal changes back to App for persistence
  function updateProposal(updated) {
    setProposal(updated);
    if (onProposalReady) onProposalReady(updated);
  }

  if (error) return (
    <div className="text-center py-12">
      <div className="text-4xl mb-4">⚠️</div>
      <h2 className="text-xl font-bold text-navy-900 mb-4">{error}</h2>
      <button onClick={onBack} className="text-navy-700 hover:text-navy-900 font-medium">← Back to Questions</button>
    </div>
  );

  if (!proposal) return (
    <div className="max-w-2xl mx-auto">
      <LoadingProgress
        estimatedSeconds={60}
        messages={['Structuring proposal sections...','Integrating vendor materials...','Cross-referencing requirements...','Drafting response sections...','Adding compliance statements...','Generating AI recommendations...','Finalizing proposal...']}
      />
    </div>
  );

  const sections = proposal.sections || [];
  const filledCount = sections.filter(s => s.content && s.content.trim().length > 20).length;

  function handleSectionUpdate(updated) {
    updateProposal({ ...proposal, sections: sections.map(s => s.id === updated.id ? updated : s) });
  }

  function handleSectionDelete(id) {
    updateProposal({ ...proposal, sections: sections.filter(s => s.id !== id) });
  }

  function handleMoveUp(idx) {
    if (idx === 0) return;
    const arr = [...sections];
    [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]];
    updateProposal({ ...proposal, sections: arr });
  }

  function handleMoveDown(idx) {
    if (idx >= sections.length - 1) return;
    const arr = [...sections];
    [arr[idx], arr[idx + 1]] = [arr[idx + 1], arr[idx]];
    updateProposal({ ...proposal, sections: arr });
  }

  function handleAddSection() {
    if (!newTitle.trim()) return;
    const newSec = {
      id: 'custom_' + Date.now(),
      title: newTitle.trim(),
      volume: 'Custom Section',
      content: '<p>Enter your content here...</p>',
      suggestions: []
    };
    updateProposal({ ...proposal, sections: [...sections, newSec] });
    setNewTitle('');
    setAdding(false);
  }

  function handleCopy() {
    copyProposalText(proposal);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  return (
    <div className="max-w-6xl mx-auto fade-in">
      <div className="flex flex-wrap justify-between items-start gap-4 mb-6">
        <div>
          <h2 className="text-2xl font-bold text-navy-900">Draft Proposal Ready ✨</h2>
          <p className="text-navy-500 text-sm mt-1">{proposal.solicitation} — {proposal.title}</p>
          <p className="text-xs text-navy-400 mt-1">{filledCount}/{sections.length} sections with content</p>
        </div>
        <div className="flex flex-wrap gap-2" data-print="hide">
          <button onClick={onBack} className="border border-navy-200 text-navy-700 hover:bg-navy-50 px-5 py-2.5 rounded-xl font-semibold text-sm">← Questions</button>
          <button onClick={handleCopy} className="border border-navy-200 text-navy-700 hover:bg-navy-50 px-5 py-2.5 rounded-xl font-semibold text-sm">
            {copied ? '✓ Copied!' : '📋 Copy All'}
          </button>
          <button onClick={onAssemble} className="bg-navy-900 hover:bg-navy-800 text-white px-6 py-2.5 rounded-xl font-semibold text-sm shadow-lg flex items-center gap-2">
            Assemble Submission →
          </button>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div className="lg:col-span-2 space-y-4">
          <CoverLetter analysis={analysis} answers={answers} proposal={proposal} onUpdate={updateProposal} />
          {sections.map((sec, idx) => (
            <SectionEditor
              key={sec.id}
              section={sec}
              onUpdate={handleSectionUpdate}
              onDelete={() => handleSectionDelete(sec.id)}
              onMoveUp={() => handleMoveUp(idx)}
              onMoveDown={() => handleMoveDown(idx)}
              isFirst={idx === 0}
              isLast={idx === sections.length - 1}
            />
          ))}

          {adding ? (
            <div className="bg-white rounded-xl border-2 border-dashed border-gold-400 p-6 fade-in">
              <label className="block text-sm font-semibold text-navy-700 mb-2">New Section Title</label>
              <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="e.g., Past Performance, Technical Approach..."
                className="w-full border border-navy-200 rounded-lg px-4 py-2.5 text-sm mb-3 focus:outline-none" style={{boxShadow: 'none'}}
                onKeyDown={e => e.key === 'Enter' && handleAddSection()} autoFocus />
              <div className="flex gap-2">
                <button onClick={handleAddSection} disabled={!newTitle.trim()} className="bg-navy-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-navy-800 disabled:opacity-30">Add Section</button>
                <button onClick={() => { setAdding(false); setNewTitle(''); }} className="border border-navy-200 text-navy-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-navy-50">Cancel</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setAdding(true)} className="w-full border-2 border-dashed border-navy-200 hover:border-navy-400 text-navy-500 hover:text-navy-700 rounded-xl py-4 text-sm font-medium transition-colors">
              + Add New Section
            </button>
          )}
        </div>

        <div className="space-y-4">
          <div className="bg-gradient-to-br from-navy-900 to-navy-800 rounded-xl p-5 text-white">
            <h3 className="font-bold flex items-center gap-2">✨ Active AI Partner</h3>
            <p className="text-navy-200 text-sm mt-2">Proactive recommendations based on RFP analysis.</p>
            <div className="mt-3 w-full bg-navy-700 rounded-full h-1.5">
              <div className="bg-emerald-400 h-1.5 rounded-full" style={{width: sections.length ? (filledCount / sections.length * 100) + '%' : '0%'}} />
            </div>
            <p className="text-xs text-navy-300 mt-2">{sections.length ? Math.round(filledCount / sections.length * 100) : 0}% complete</p>
          </div>

          <SubmissionSidebar proposal={proposal} analysis={analysis} onAssemble={onAssemble} />
          <PageCounter proposal={proposal} analysis={analysis} />
          <ScoreMaximizer analysis={analysis} />
          <ComplianceChecklist analysis={analysis} proposal={proposal} />

          {(proposal.overallSuggestions || []).map((s, i) => (
            <div key={i} className="bg-white rounded-xl border border-navy-100 shadow-sm p-4 fade-in">
              <div className="flex items-start gap-3">
                <span className="text-xl">{s.icon || '💡'}</span>
                <div><h4 className="text-sm font-semibold text-navy-800">{s.title}</h4><p className="text-xs text-navy-500 mt-1 leading-relaxed">{s.text}</p></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Cover Letter / Introduction ──
function CoverLetter({ analysis, answers, proposal, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [expanded, setExpanded] = useState(true);

  const rfp = analysis.rfpSummary || {};
  const sub = analysis.submissionInstructions || {};

  // Extract vendor info from Q&A answers
  const allAnswers = (answers || []).filter(a => a.answer && a.answer.trim());
  const companyAnswer = allAnswers.find(a => /company|firm|organization/i.test(a.question));
  const contactAnswer = allAnswers.find(a => /contact|principal|authorized|signatory/i.test(a.question));

  const today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  // Build letter from available data
  const letterData = proposal.coverLetter || {
    date: today,
    recipientName: sub.address ? sub.address.split('\n')[0] : (rfp.agency || '[Procurement Officer Name]'),
    recipientOrg: rfp.agency || '[Agency Name]',
    recipientAddress: sub.address || '[Agency Address]',
    companyName: companyAnswer ? companyAnswer.answer.split('.')[0].substring(0, 60) : '[Your Company Name]',
    signerName: contactAnswer ? contactAnswer.answer.split(',')[0].split('.')[0].substring(0, 40) : '[Authorized Signatory]',
    signerTitle: '[Title]',
    signerEmail: '[email]',
    signerPhone: '[phone]',
    body: null, // will be generated
  };

  // Generate the letter body HTML
  const letterHtml = letterData.body || `<p>Dear ${letterData.recipientName.replace(/\[.*\]/, 'Sir/Madam')},</p>
<p>We are pleased to submit this comprehensive proposal in response to the Request for Proposal${rfp.solicitation ? ' (' + rfp.solicitation + ')' : ''} issued by <strong>${letterData.recipientOrg}</strong>${rfp.title ? ' seeking <em>' + rfp.title + '</em>' : ''}.</p>
<p><strong>${letterData.companyName}</strong> is honored to have the opportunity to collaborate with ${letterData.recipientOrg} on this undertaking, and we are confident in our ability to deliver beyond satisfactory results.</p>
<p>What follows is our proposal including ${(proposal.sections || []).map(s => s.title).slice(0, 4).join(', ')}${(proposal.sections || []).length > 4 ? ', and additional supporting materials' : ''}. This proposal has been prepared in strict adherence to the format and requirements outlined in the RFP.</p>
<p>We welcome an opportunity to review the contents of this proposal and the shared documents over a call or in an in-person session at your convenience.</p>`;

  function handleSave(newBody) {
    const updated = { ...proposal, coverLetter: { ...letterData, body: newBody } };
    onUpdate(updated);
    setEditing(false);
  }

  return (
    <div className="bg-white rounded-xl border border-navy-100 shadow-sm mb-4">
      <div className="flex items-center">
        <button onClick={() => setExpanded(!expanded)} className="flex-1 px-6 py-4 flex items-center gap-4 text-left hover:bg-navy-50/50">
          <span className="text-lg">✉️</span>
          <div className="flex-1">
            <h3 className="font-semibold text-navy-800">Introduction / Cover Letter</h3>
            <p className="text-xs text-navy-400">Formal letter preceding the proposal</p>
          </div>
          <span className="text-navy-400">{expanded ? '▲' : '▼'}</span>
        </button>
      </div>
      <div className="border-t border-navy-100 print-section-body" style={{display: expanded ? 'block' : 'none'}}>
          {editing ? (
            <div className="px-6 py-4">
              <div className="grid grid-cols-2 gap-3 mb-4">
                <div>
                  <label className="block text-xs font-semibold text-navy-600 mb-1">Your Company</label>
                  <input type="text" defaultValue={letterData.companyName} className="w-full border border-navy-200 rounded-lg px-3 py-2 text-sm focus:outline-none" style={{boxShadow:'none'}}
                    onBlur={e => { letterData.companyName = e.target.value; }} />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-navy-600 mb-1">Signer Name</label>
                  <input type="text" defaultValue={letterData.signerName} className="w-full border border-navy-200 rounded-lg px-3 py-2 text-sm focus:outline-none" style={{boxShadow:'none'}}

// ── Live Compliance Checklist (Gate vs Scored vs Informational) ──
function ComplianceChecklist({ analysis, proposal }) {
  const [checks, setChecks] = useState({});
  const [expanded, setExpanded] = useState(true);

  function toggle(key) {
    setChecks(prev => ({ ...prev, [key]: !prev[key] }));
  }

  // Build items with criteriaType
  const formatItems = (analysis.requiredFormat || []).map((f, i) => ({
    key: 'fmt_' + i,
    label: (f.sectionNumber ? f.sectionNumber + '. ' : '') + f.sectionTitle,
    criteriaType: 'informational',
    ref: f.description || '',
  }));

  const reqItems = (analysis.requirements || []).filter(r => r.type === 'mandatory').map((r, i) => ({
    key: 'req_' + i,
    label: r.text.length > 80 ? r.text.substring(0, 80) + '...' : r.text,
    criteriaType: 'gate',
    ref: r.section || '',
  }));

  const compItems = (analysis.complianceChecklist || []).map((c, i) => ({
    key: 'comp_' + i,
    label: c.item,
    criteriaType: c.criteriaType || (c.critical ? 'gate' : 'informational'),
    ref: c.rfpReference || '',
  }));

  const allItems = [...formatItems, ...reqItems, ...compItems];

  // Group by criteria type
  const gateItems = allItems.filter(it => it.criteriaType === 'gate');
  const scoredItems = allItems.filter(it => it.criteriaType === 'scored');
  const infoItems = allItems.filter(it => it.criteriaType === 'informational');

  const checkedCount = allItems.filter(it => checks[it.key]).length;
  const pct = allItems.length ? Math.round(checkedCount / allItems.length * 100) : 0;
  const gateUnchecked = gateItems.filter(it => !checks[it.key]).length;

  const groups = [
    { title: 'Disqualification Risks', items: gateItems, color: 'text-red-600', bgColor: 'bg-red-50', borderColor: 'border-red-100', description: 'Fail any = eliminated' },
    { title: 'Scored Criteria', items: scoredItems, color: 'text-gold-600', bgColor: 'bg-gold-400/5', borderColor: 'border-gold-400/20', description: 'Point opportunities' },
    { title: 'Submission & Format', items: infoItems, color: 'text-navy-600', bgColor: '', borderColor: '', description: 'Administrative items' },
  ].filter(g => g.items.length > 0);

  return (
    <div className="bg-white rounded-xl border border-navy-100 shadow-sm">
      <button onClick={() => setExpanded(!expanded)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-navy-50/50">
        <div className="flex items-center gap-2">
          <h4 className="text-sm font-semibold text-navy-800">Compliance Checklist</h4>
        </div>
        <div className="flex items-center gap-2">
          {gateUnchecked > 0 && <span className="text-xs font-bold text-red-500">{gateUnchecked} gates open</span>}
          <span className={`text-xs font-bold ${pct === 100 ? 'text-emerald-600' : pct > 50 ? 'text-gold-500' : 'text-navy-400'}`}>{checkedCount}/{allItems.length}</span>
          <span className="text-navy-400 text-xs">{expanded ? '▲' : '▼'}</span>
        </div>
      </button>
      {expanded && (
        <div className="border-t border-navy-100 px-4 py-3">
          <div className="w-full bg-navy-100 rounded-full h-1.5 mb-3">
            <div className={`h-1.5 rounded-full transition-all ${pct === 100 ? 'bg-emerald-400' : gateUnchecked > 0 ? 'bg-red-400' : 'bg-gold-400'}`} style={{width: pct + '%'}}/>
          </div>

          {gateUnchecked > 0 && (
            <div className="mb-3 px-2 py-1.5 bg-red-50 border border-red-100 rounded-lg">
              <p className="text-xs font-semibold text-red-600">⚠️ {gateUnchecked} pass/fail requirement{gateUnchecked > 1 ? 's' : ''} not yet confirmed — proposal at risk of disqualification</p>
            </div>
          )}

          {groups.map(g => (
            <div key={g.title} className="mb-3 last:mb-0">
              <div className={`flex items-center justify-between mb-1.5 ${g.bgColor ? g.bgColor + ' ' + g.borderColor + ' border rounded-lg px-2 py-1' : ''}`}>
                <p className={`text-xs font-semibold ${g.color}`}>{g.title}</p>
                <p className="text-xs text-navy-400">{g.description}</p>
              </div>
              <div className="space-y-1">
                {g.items.map(it => (
                  <label key={it.key} className="flex items-start gap-2 cursor-pointer group py-0.5">
                    <input type="checkbox" checked={!!checks[it.key]} onChange={() => toggle(it.key)}
                      className="w-3.5 h-3.5 mt-0.5 rounded flex-shrink-0" />
                    <span className={`text-xs leading-relaxed ${checks[it.key] ? 'text-navy-400 line-through' : 'text-navy-700'}`}>
                      {it.label}
                    </span>
                  </label>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Live Page Counter ──
function PageCounter({ proposal, analysis }) {
  const pageConstraints = analysis.pageConstraints || analysis.rfpSummary?.pageLimits ? {
    totalPageLimit: (analysis.pageConstraints || {}).totalPageLimit || analysis.rfpSummary?.pageLimits || null,
    fontMinSize: (analysis.pageConstraints || {}).fontMinSize || null,
    pageFormat: (analysis.pageConstraints || {}).pageFormat || null,
    exclusions: (analysis.pageConstraints || {}).exclusions || [],
    sectionLimits: (analysis.pageConstraints || {}).sectionLimits || [],
  } : null;

  // Count words across all proposal sections
  const sections = proposal?.sections || [];
  let totalWords = 0;
  const sectionCounts = sections.map(s => {
    const div = document.createElement('div');
    div.innerHTML = s.content || '';
    const text = div.textContent || '';
    const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
    totalWords += words;
    return { title: s.title, words };
  });

  // Cover letter word count
  const clDiv = document.createElement('div');
  clDiv.innerHTML = proposal?.coverLetter?.body || '';
  const clWords = (clDiv.textContent || '').trim().split(/\s+/).filter(w => w.length > 0).length;
  totalWords += clWords;

  // ~275 words per printed page (single-spaced, 10-11pt)
  const WORDS_PER_PAGE = 275;
  const estimatedPages = Math.ceil(totalWords / WORDS_PER_PAGE);

  // Parse page limit
  let pageLimit = null;
  if (pageConstraints?.totalPageLimit) {
    const match = String(pageConstraints.totalPageLimit).match(/(\d+)/);
    if (match) pageLimit = parseInt(match[1]);
  }

  const isOverLimit = pageLimit && estimatedPages > pageLimit;
  const isNearLimit = pageLimit && estimatedPages > pageLimit * 0.85 && !isOverLimit;

  return (
    <div className={`bg-white rounded-xl border shadow-sm ${isOverLimit ? 'border-red-200' : 'border-navy-100'}`}>
      <div className="px-4 py-3">
        <div className="flex items-center justify-between mb-2">
          <div className="flex items-center gap-2">
            <span className="text-sm">📏</span>
            <h4 className="text-sm font-semibold text-navy-800">Page Estimate</h4>
          </div>
          <div className="flex items-center gap-1.5">
            <span className={`text-lg font-bold ${isOverLimit ? 'text-red-500' : isNearLimit ? 'text-amber-500' : 'text-navy-900'}`}>{estimatedPages}</span>
            {pageLimit && <span className="text-xs text-navy-400">/ {pageLimit} pages</span>}
          </div>
        </div>

        {pageLimit && (
          <div className="w-full bg-navy-100 rounded-full h-2 mb-2">
            <div className={`h-2 rounded-full transition-all ${isOverLimit ? 'bg-red-400' : isNearLimit ? 'bg-amber-400' : 'bg-emerald-400'}`}
              style={{width: Math.min(100, (estimatedPages / pageLimit) * 100) + '%'}} />
          </div>
        )}

        {isOverLimit && (
          <div className="bg-red-50 border border-red-100 rounded-lg px-2 py-1.5 mb-2">
            <p className="text-xs font-semibold text-red-600">⚠️ Exceeds page limit by ~{estimatedPages - pageLimit} page{estimatedPages - pageLimit > 1 ? 's' : ''} — may be rejected</p>
          </div>
        )}
        {isNearLimit && (
          <div className="bg-amber-50 border border-amber-100 rounded-lg px-2 py-1.5 mb-2">
            <p className="text-xs font-medium text-amber-700">Approaching page limit — {pageLimit - estimatedPages} page{pageLimit - estimatedPages > 1 ? 's' : ''} remaining</p>
          </div>
        )}

        <div className="text-xs text-navy-400 space-y-0.5">
          <p>{totalWords.toLocaleString()} words total (~{WORDS_PER_PAGE} words/page)</p>
          {pageConstraints?.fontMinSize && <p>Min font: {pageConstraints.fontMinSize}</p>}
          {pageConstraints?.pageFormat && <p>Format: {pageConstraints.pageFormat}</p>}
          {pageConstraints?.exclusions?.length > 0 && <p>Excluded from count: {pageConstraints.exclusions.join(', ')}</p>}
        </div>

        {sectionCounts.length > 0 && (
          <details className="mt-2">
            <summary className="text-xs text-navy-500 cursor-pointer hover:text-navy-700 font-medium">Section breakdown</summary>
            <div className="mt-1 space-y-0.5">
              {clWords > 0 && (
                <div className="flex justify-between text-xs">
                  <span className="text-navy-500 truncate mr-2">Cover Letter</span>
                  <span className="text-navy-400 flex-shrink-0">{clWords}w · ~{Math.ceil(clWords / WORDS_PER_PAGE)}p</span>
                </div>
              )}
              {sectionCounts.map((sc, i) => (
                <div key={i} className="flex justify-between text-xs">
                  <span className="text-navy-500 truncate mr-2">{sc.title}</span>
                  <span className="text-navy-400 flex-shrink-0">{sc.words}w · ~{Math.max(1, Math.ceil(sc.words / WORDS_PER_PAGE))}p</span>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>
    </div>
  );
}

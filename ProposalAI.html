// ── Submission Builder — Full Storyboard View ──
function SubmissionBuilder({ proposal, analysis, answers, allDocuments = [], onBack }) {
  const WORDS_PER_PAGE = 275;

  // Build initial package items from proposal
  function buildInitialPackage() {
    const items = [];
    // Cover letter
    const cl = proposal.coverLetter || {};
    const clBody = cl.body || '';
    items.push({
      id: 'cover_letter',
      type: 'cover_letter',
      title: 'Cover Letter',
      subtitle: cl.companyName || 'Introduction',
      wordCount: clBody.replace(/<[^>]*>/g, '').trim().split(/\s+/).filter(w => w).length,
      included: true,
      source: 'proposal',
    });
    // Proposal sections
    (proposal.sections || []).forEach((s, i) => {
      const div = document.createElement('div');
      div.innerHTML = s.content || '';
      const words = (div.textContent || '').trim().split(/\s+/).filter(w => w).length;
      items.push({
        id: 'section_' + (s.id || i),
        sectionId: s.id,
        type: 'proposal_section',
        title: s.title,
        subtitle: s.volume || 'Proposal Section',
        wordCount: words,
        included: true,
        source: 'proposal',
      });
    });
    return items;
  }

  // Build library items from uploaded/vault docs
  function buildLibrary() {
    const typeLabels = {
      team_bios: 'Team Bio / CV',
      past_performance: 'Past Performance',
      certifications: 'Certification / License',
      vendor_capability: 'Capability Statement',
      vendor_summary: 'Vendor Summary',
      supporting: 'Supporting Document',
    };
    const appendixTypes = ['team_bios','past_performance','certifications','vendor_capability','vendor_summary','supporting'];
    return allDocuments
      .filter(d => appendixTypes.includes(d.type) && d.text && d.text.trim().length > 20)
      .map((d, i) => ({
        id: 'lib_' + i + '_' + d.type,
        type: 'appendix',
        docType: d.type,
        title: (d.name || 'Document').replace(/^\[Vault\] /, ''),
        subtitle: typeLabels[d.type] || d.type,
        wordCount: (d.text || '').trim().split(/\s+/).filter(w => w).length,
        text: d.text,
        included: false,
        source: 'library',
      }));
  }

  // Check RFP for required attachments
  function buildRequiredItems() {
    const required = [];
    const requiredForms = analysis.requiredForms || [];
    const assetRequests = analysis.assetRequests || [];
    requiredForms.forEach((f, i) => {
      required.push({
        id: 'form_' + i,
        type: 'required_form',
        title: f.formName || f.name || 'Required Form',
        subtitle: 'PDF form — complete separately',
        wordCount: 0,
        included: false,
        source: 'required',
        isMissing: true,
      });
    });
    assetRequests.filter(a => a.type !== 'form').forEach((a, i) => {
      required.push({
        id: 'asset_' + i,
        type: 'required_asset',
        title: a.description || a.name || 'Requested Document',
        subtitle: 'Attachment — provide separately',
        wordCount: 0,
        included: false,
        source: 'required',
        isMissing: true,
      });
    });
    return required;
  }

  const [packageItems, setPackageItems] = useState(buildInitialPackage);
  const [libraryItems, setLibraryItems] = useState(buildLibrary);
  const [requiredItems] = useState(buildRequiredItems);
  const [dragItem, setDragItem] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const [downloading, setDownloading] = useState(false);

  // Auto-match library items to RFP requirements on first render
  useEffect(() => {
    // Auto-include library items that match RFP-required types
    const reqTypes = new Set();
    (analysis.requirements || []).forEach(r => {
      if (/team|personnel|staff|cv|bio|resume/i.test(r.text)) reqTypes.add('team_bios');
      if (/past performance|experience|track record/i.test(r.text)) reqTypes.add('past_performance');
      if (/certif|licen|accredit/i.test(r.text)) reqTypes.add('certifications');
      if (/capability|organization|company profile/i.test(r.text)) reqTypes.add('vendor_capability');
    });
    if (reqTypes.size > 0) {
      const toAdd = [];
      setLibraryItems(prev => {
        const remaining = [];
        prev.forEach(item => {
          if (reqTypes.has(item.docType)) {
            toAdd.push({ ...item, included: true, autoMatched: true });
          } else {
            remaining.push(item);
          }
        });
        return remaining;
      });
      if (toAdd.length > 0) {
        setPackageItems(prev => [...prev, ...toAdd]);
      }
    }
  }, []);

  // Drag handlers for reordering within the package
  function handleDragStart(e, item, fromLibrary) {
    setDragItem({ ...item, fromLibrary });
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.id);
  }

  function handleDragOver(e, idx) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    setDragOverIdx(idx);
  }

  function handleDrop(e, targetIdx) {
    e.preventDefault();
    setDragOverIdx(null);
    if (!dragItem) return;

    if (dragItem.fromLibrary) {
      // Move from library to package at target position
      setLibraryItems(prev => prev.filter(it => it.id !== dragItem.id));
      const newItem = { ...dragItem, included: true, fromLibrary: undefined };
      setPackageItems(prev => {
        const arr = [...prev];
        arr.splice(targetIdx, 0, newItem);
        return arr;
      });
    } else {
      // Reorder within package
      setPackageItems(prev => {
        const arr = [...prev];
        const fromIdx = arr.findIndex(it => it.id === dragItem.id);
        if (fromIdx === -1 || fromIdx === targetIdx) return prev;
        const [moved] = arr.splice(fromIdx, 1);
        arr.splice(targetIdx > fromIdx ? targetIdx - 1 : targetIdx, 0, moved);
        return arr;
      });
    }
    setDragItem(null);
  }

  function handleDragEnd() {
    setDragItem(null);
    setDragOverIdx(null);
  }

  // Add from library
  function addToPackage(item) {
    setLibraryItems(prev => prev.filter(it => it.id !== item.id));
    setPackageItems(prev => [...prev, { ...item, included: true }]);
  }

  // Remove from package back to library
  function removeFromPackage(item) {
    setPackageItems(prev => prev.filter(it => it.id !== item.id));
    if (item.source === 'library') {
      setLibraryItems(prev => [...prev, { ...item, included: false }]);
    }
  }

  // Move up/down
  function moveItem(idx, dir) {
    setPackageItems(prev => {
      const arr = [...prev];
      const target = idx + dir;
      if (target < 0 || target >= arr.length) return prev;
      [arr[idx], arr[target]] = [arr[target], arr[idx]];
      return arr;
    });
  }

  // Add a custom divider / section break
  function addDivider(afterIdx) {
    const divider = {
      id: 'divider_' + Date.now(),
      type: 'divider',
      title: 'Section Break',
      subtitle: 'Page break in final document',
      wordCount: 0,
      included: true,
      source: 'custom',
    };
    setPackageItems(prev => {
      const arr = [...prev];
      arr.splice(afterIdx + 1, 0, divider);
      return arr;
    });
  }

  // Totals
  const totalWords = packageItems.filter(it => it.included).reduce((s, it) => s + it.wordCount, 0);
  const totalPages = Math.ceil(totalWords / WORDS_PER_PAGE);
  const pageLimit = (analysis.pageConstraints || {}).totalPageLimit;
  const overLimit = pageLimit && totalPages > parseInt(pageLimit);

  // Build download package
  async function handleDownload() {
    setDownloading(true);
    try {
      await downloadAssembledPackage(proposal, analysis, answers, packageItems, allDocuments);
    } catch (e) { console.error('ZIP error:', e); }
    setDownloading(false);
  }

  // Type badge colors
  const badgeColors = {
    cover_letter: 'bg-blue-100 text-blue-700',
    proposal_section: 'bg-navy-100 text-navy-700',
    appendix: 'bg-purple-100 text-purple-700',
    divider: 'bg-navy-50 text-navy-400',
    required_form: 'bg-amber-100 text-amber-700',
    required_asset: 'bg-amber-100 text-amber-700',
  };

  const badgeLabels = {
    cover_letter: 'Cover Letter',
    proposal_section: 'Proposal',
    appendix: 'Appendix',
    divider: 'Break',
    required_form: 'Form',
    required_asset: 'Attachment',
  };

  const sub = analysis.submissionInstructions || {};

  return (
    <div className="max-w-7xl mx-auto fade-in">
      <div className="flex flex-wrap justify-between items-start gap-4 mb-6">
        <div>
          <h2 className="text-2xl font-bold text-navy-900">Assemble Submission Package</h2>
          <p className="text-navy-500 text-sm mt-1">Drag to reorder. Add appendix materials from the library. Download when ready.</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button onClick={onBack} className="border border-navy-200 text-navy-700 hover:bg-navy-50 px-5 py-2.5 rounded-xl font-semibold text-sm">← Proposal</button>
          <button onClick={handleDownload} disabled={downloading} className="bg-navy-900 hover:bg-navy-800 text-white px-6 py-2.5 rounded-xl font-semibold text-sm shadow-lg disabled:opacity-60">
            {downloading ? 'Packaging...' : 'Download .zip'}
          </button>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* Package storyboard — left 2/3 */}
        <div className="lg:col-span-2">
          {/* Summary bar */}
          <div className="bg-white rounded-xl border border-navy-100 shadow-sm p-4 mb-4 flex flex-wrap items-center gap-4">
            <div className="flex items-center gap-2">
              <span className="text-sm font-semibold text-navy-800">{packageItems.length} items</span>
              <span className="text-navy-300">·</span>
              <span className={`text-sm font-semibold ${overLimit ? 'text-red-600' : 'text-navy-600'}`}>~{totalPages} pages</span>
              {pageLimit && <span className="text-xs text-navy-400">/ {pageLimit} limit</span>}
            </div>
            {overLimit && <span className="text-xs font-bold text-red-500 bg-red-50 px-2 py-1 rounded-full">Over page limit</span>}
            {sub.deadline && <span className="text-xs font-medium text-red-600 ml-auto">Deadline: {sub.deadline}</span>}
          </div>

          {/* Storyboard cards */}
          <div className="space-y-1">
            {packageItems.map((item, idx) => (
              <div key={item.id}>
                {/* Drop zone before this item */}
                <div
                  onDragOver={e => handleDragOver(e, idx)}
                  onDrop={e => handleDrop(e, idx)}
                  className={`h-1 rounded transition-all ${dragOverIdx === idx ? 'bg-gold-400 h-2' : ''}`}
                />
                {item.type === 'divider' ? (
                  <div className="flex items-center gap-3 py-2 px-4 group"
                    draggable onDragStart={e => handleDragStart(e, item, false)} onDragEnd={handleDragEnd}>
                    <div className="flex-1 border-t-2 border-dashed border-navy-200" />
                    <span className="text-xs text-navy-400 font-medium whitespace-nowrap">Page Break</span>
                    <div className="flex-1 border-t-2 border-dashed border-navy-200" />
                    <button onClick={() => removeFromPackage(item)} className="text-navy-300 hover:text-red-500 text-xs opacity-0 group-hover:opacity-100 transition-opacity">Remove</button>
                  </div>
                ) : (
                  <div
                    draggable
                    onDragStart={e => handleDragStart(e, item, false)}
                    onDragEnd={handleDragEnd}
                    className={`bg-white rounded-xl border shadow-sm p-4 flex items-center gap-4 cursor-grab active:cursor-grabbing transition-all hover:shadow-md group ${
                      item.autoMatched ? 'border-gold-400/50' : 'border-navy-100'
                    }`}
                  >
                    {/* Drag handle + position number */}
                    <div className="flex flex-col items-center gap-0.5 text-navy-300 select-none">
                      <span className="text-xs">⠿</span>
                      <span className="text-xs font-bold text-navy-400">{idx + 1}</span>
                    </div>

                    {/* Type badge */}
                    <span className={`text-xs font-medium px-2 py-0.5 rounded-full whitespace-nowrap ${badgeColors[item.type] || 'bg-navy-100 text-navy-600'}`}>
                      {badgeLabels[item.type] || item.type}
                    </span>

                    {/* Title + subtitle */}
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-semibold text-navy-800 truncate">{item.title}</p>
                      <p className="text-xs text-navy-400 truncate">{item.subtitle}</p>
                    </div>

                    {/* Word / page count */}
                    {item.wordCount > 0 && (
                      <div className="text-right flex-shrink-0">
                        <p className="text-xs font-medium text-navy-600">~{Math.ceil(item.wordCount / WORDS_PER_PAGE)} pg</p>
                        <p className="text-xs text-navy-400">{item.wordCount.toLocaleString()} words</p>
                      </div>
                    )}

                    {/* Auto-matched badge */}
                    {item.autoMatched && (
                      <span className="text-xs text-gold-600 bg-gold-400/10 px-2 py-0.5 rounded-full whitespace-nowrap">Auto-matched</span>
                    )}

                    {/* Actions */}
                    <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                      <button onClick={() => moveItem(idx, -1)} disabled={idx === 0} className="p-1 text-navy-400 hover:text-navy-700 disabled:opacity-20" title="Move up">↑</button>
                      <button onClick={() => moveItem(idx, 1)} disabled={idx === packageItems.length - 1} className="p-1 text-navy-400 hover:text-navy-700 disabled:opacity-20" title="Move down">↓</button>
                      <button onClick={() => addDivider(idx)} className="p-1 text-navy-400 hover:text-navy-700" title="Add page break after">┄</button>
                      {item.source !== 'proposal' && (
                        <button onClick={() => removeFromPackage(item)} className="p-1 text-navy-400 hover:text-red-500" title="Remove">✕</button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            ))}

            {/* Final drop zone */}
            <div
              onDragOver={e => handleDragOver(e, packageItems.length)}
              onDrop={e => handleDrop(e, packageItems.length)}
              className={`h-8 rounded-xl border-2 border-dashed transition-all flex items-center justify-center ${
                dragOverIdx === packageItems.length ? 'border-gold-400 bg-gold-400/5' : 'border-navy-200/50'
              }`}
            >
              <span className="text-xs text-navy-300">Drop here to add at end</span>
            </div>
          </div>
        </div>

        {/* Right sidebar — Material Library */}
        <div className="space-y-4">
          {/* Available materials */}
          <div className="bg-white rounded-xl border border-navy-100 shadow-sm">
            <div className="px-4 py-3 border-b border-navy-100">
              <h4 className="text-sm font-semibold text-navy-800">Material Library</h4>
              <p className="text-xs text-navy-400 mt-0.5">Drag into the package or click to add</p>
            </div>
            <div className="px-4 py-3">
              {libraryItems.length === 0 ? (
                <p className="text-xs text-navy-400 text-center py-4">All available materials are in the package</p>
              ) : (
                <div className="space-y-2">
                  {libraryItems.map(item => (
                    <div
                      key={item.id}
                      draggable
                      onDragStart={e => handleDragStart(e, item, true)}
                      onDragEnd={handleDragEnd}
                      className="bg-navy-50 rounded-lg p-3 cursor-grab active:cursor-grabbing hover:bg-navy-100 transition-colors group"
                    >
                      <div className="flex items-start gap-2">
                        <span className={`text-xs font-medium px-1.5 py-0.5 rounded ${badgeColors.appendix} flex-shrink-0`}>
                          {item.subtitle}
                        </span>
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-medium text-navy-800 truncate">{item.title}</p>
                          <p className="text-xs text-navy-400">{item.wordCount.toLocaleString()} words · ~{Math.ceil(item.wordCount / WORDS_PER_PAGE)} pg</p>
                        </div>
                        <button onClick={() => addToPackage(item)} className="text-xs text-navy-500 hover:text-navy-800 font-bold opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0" title="Add to package">+</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Required items not yet in package */}
          {requiredItems.length > 0 && (
            <div className="bg-white rounded-xl border border-amber-200 shadow-sm">
              <div className="px-4 py-3 border-b border-amber-100 bg-amber-50 rounded-t-xl">
                <h4 className="text-sm font-semibold text-amber-800">RFP Requirements</h4>
                <p className="text-xs text-amber-600 mt-0.5">These need to be prepared separately</p>
              </div>
              <div className="px-4 py-3 space-y-2">
                {requiredItems.map(item => (
                  <div key={item.id} className="flex items-start gap-2 py-1">
                    <span className="w-4 h-4 rounded border-2 border-amber-300 flex-shrink-0 mt-0.5" />
                    <div>
                      <p className="text-xs font-medium text-navy-700">{item.title}</p>
                      <p className="text-xs text-navy-400">{item.subtitle}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Submission info */}
          {(sub.method || sub.email || sub.portal) && (
            <div className="bg-white rounded-xl border border-navy-100 shadow-sm p-4">
              <h4 className="text-sm font-semibold text-navy-800 mb-2">Submission Details</h4>
              {sub.method && <p className="text-xs text-navy-600 mb-1">{sub.method}</p>}
              {sub.email && <p className="text-xs text-navy-500">Email: {sub.email}</p>}
              {sub.portal && <p className="text-xs text-navy-500">Portal: {sub.portal}</p>}
              {sub.deadline && <p className="text-xs text-red-600 font-medium mt-2">Deadline: {sub.deadline}</p>}
            </div>
          )}

          {/* Download section */}
          <div className="bg-gradient-to-br from-navy-900 to-navy-800 rounded-xl p-5 text-white">
            <h3 className="font-bold text-sm mb-2">Ready to Submit?</h3>
            <p className="text-navy-200 text-xs mb-3">Your package has {packageItems.length} items across ~{totalPages} pages.</p>
            <button onClick={handleDownload} disabled={downloading} className="w-full bg-gold-400 hover:bg-gold-500 text-navy-900 px-4 py-2.5 rounded-xl font-bold text-sm shadow-lg transition-colors disabled:opacity-60">
              {downloading ? 'Packaging ZIP...' : 'Download Full Package (.zip)'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Download as Word Doc ──
function downloadAsWord(proposal, analysis) {
  const html = buildProposalDocHtml(proposal, analysis);
  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (proposal.title || 'Proposal').replace(/[^a-zA-Z0-9 ]/g, '') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Download Assembled Package (from SubmissionBuilder storyboard order) ──
// ── Build the proposal .doc HTML (cover letter + sections only) ──
function buildProposalDocHtml(proposal, analysis) {
  const cl = proposal.coverLetter || {};
  const rfp = (analysis || {}).rfpSummary || {};
  const sub = (analysis || {}).submissionInstructions || {};
  const today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const clCompany = cl.companyName || '[Your Company Name]';
  const clSigner = cl.signerName || '[Authorized Signatory]';
  const clTitle = cl.signerTitle || '[Title]';
  const clRecipient = cl.recipientName || (rfp.agency || '[Procurement Officer]');
  const clOrg = cl.recipientOrg || rfp.agency || '[Agency]';
  const clAddr = cl.recipientAddress || sub.address || '';
  const clBody = cl.body || '<p>Dear ' + clRecipient + ',</p><p>We are pleased to submit this proposal.</p>';

  const coverLetterHtml = '<div style="page-break-after:always;">'
    + '<p style="text-align:right;color:#334e68;">' + (cl.date || today) + '</p>'
    + '<p style="color:#334e68;white-space:pre-line;margin-top:32px;">' + clRecipient + '\n' + clOrg + '\n' + clAddr + '</p>'
    + '<div style="margin-top:24px;">' + clBody + '</div>'
    + '<p style="margin-top:40px;">Best,</p>'
    + '<p style="margin-top:32px;font-style:italic;color:#9fb3c8;font-size:9pt;">[Signature]</p>'
    + '<p style="font-weight:bold;margin-top:4px;">' + clSigner + '</p>'
    + '<p>' + clTitle + '</p>'
    + '<p style="margin-top:12px;color:#627d98;">' + clCompany + '</p>'
    + (cl.signerEmail && cl.signerEmail !== '[email]' ? '<p style="color:#829ab1;font-size:9pt;">' + cl.signerEmail + '</p>' : '')
    + (cl.signerPhone && cl.signerPhone !== '[phone]' ? '<p style="color:#829ab1;font-size:9pt;">' + cl.signerPhone + '</p>' : '')
    + '</div>';

  const sections = (proposal.sections || []).map(s =>
    '<h2 style="color:#102a43;border-bottom:2px solid #d9e2ec;padding-bottom:4px;margin-top:24px;">' + s.title + '</h2>' + (s.content || '')
  ).join('');

  return [
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">',
    '<head><meta charset="utf-8"><title>' + (proposal.title || 'Proposal') + '</title>',
    '<style>',
    'body { font-family: Calibri, Arial, sans-serif; color: #334e68; line-height: 1.6; margin: 40px; }',
    'h1 { color: #102a43; font-size: 24pt; margin-bottom: 4px; }',
    'h2 { color: #102a43; font-size: 16pt; }',
    'h3 { color: #243b53; font-size: 13pt; }',
    'p { margin-bottom: 8px; }',
    'table { width: 100%; border-collapse: collapse; margin: 12px 0; }',
    'th { background: #f0f4f8; padding: 6px 10px; text-align: left; font-weight: 600; border: 1px solid #d9e2ec; }',
    'td { padding: 6px 10px; border: 1px solid #d9e2ec; }',
    'ul, ol { margin-bottom: 8px; padding-left: 24px; }',
    'li { margin-bottom: 4px; }',
    '</style></head><body>',
    coverLetterHtml,
    '<h1>' + (proposal.title || 'Proposal') + '</h1>',
    '<p style="color:#627d98;font-size:10pt;">' + (proposal.solicitation || '') + '</p>',
    '<hr style="border:1px solid #d9e2ec;margin:16px 0;">',
    sections,
    '</body></html>'
  ].join('');
}

// ── Download Assembled Package as ZIP ──
async function downloadAssembledPackage(proposal, analysis, answers, packageItems, allDocuments) {
  const zip = new JSZip();
  const safeName = (s) => (s || 'Document').replace(/[^a-zA-Z0-9 _\-\.]/g, '').substring(0, 80);
  const proposalTitle = safeName(proposal.title || 'Proposal');

  // Build file index for the Table of Contents
  const tocLines = [];
  let fileNum = 0;

  // --- 1. Proposal document (cover letter + all sections) ---
  fileNum++;
  const prefix = String(fileNum).padStart(2, '0');
  const proposalHtml = buildProposalDocHtml(proposal, analysis);
  const proposalFileName = prefix + ' - ' + proposalTitle + '.doc';
  zip.file(proposalFileName, '\ufeff' + proposalHtml);
  tocLines.push({ num: fileNum, name: proposalFileName, description: 'Cover letter and full proposal' });

  // --- 2. Appendix files in storyboard order ---
  const appendixItems = packageItems.filter(it => it.type === 'appendix');
  let appendixLetter = 0;

  for (const item of appendixItems) {
    fileNum++;
    appendixLetter++;
    const letter = String.fromCharCode(64 + appendixLetter);
    const numPrefix = String(fileNum).padStart(2, '0');

    // Try to find the original file blob from allDocuments
    const matchDoc = allDocuments.find(d => {
      const cleanName = (d.name || '').replace(/^\[Vault\] /, '');
      return cleanName === item.title || d.name === item.title;
    });

    if (matchDoc && matchDoc.originalFile) {
      // Include original file in its native format
      const ext = matchDoc.originalFile.name.split('.').pop() || 'pdf';
      const fileName = numPrefix + ' - Appendix ' + letter + ' - ' + safeName(item.title) + '.' + ext;
      const buf = await matchDoc.originalFile.arrayBuffer();
      zip.file(fileName, buf);
      tocLines.push({ num: fileNum, name: fileName, description: item.subtitle + ' (original format)' });
    } else {
      // Text-only (vault doc) — render as .doc
      const text = item.text || '';
      const docHtml = [
        '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">',
        '<head><meta charset="utf-8"><title>' + item.title + '</title>',
        '<style>body { font-family: Calibri, Arial, sans-serif; color: #334e68; line-height: 1.6; margin: 40px; } h1 { color: #102a43; font-size: 20pt; } h2 { color: #102a43; font-size: 16pt; } p { margin-bottom: 8px; }</style></head><body>',
        '<h1>Appendix ' + letter + ': ' + item.title + '</h1>',
        '<p style="color:#627d98;font-size:10pt;margin-bottom:16px;">' + item.subtitle + '</p>',
        '<hr style="border:1px solid #d9e2ec;margin:12px 0;">',
        text.split('\n').filter(l => l.trim()).map(l => '<p>' + l + '</p>').join(''),
        '</body></html>'
      ].join('');
      const fileName = numPrefix + ' - Appendix ' + letter + ' - ' + safeName(item.title) + '.doc';
      zip.file(fileName, '\ufeff' + docHtml);
      tocLines.push({ num: fileNum, name: fileName, description: item.subtitle + ' (generated from text)' });
    }
  }

  // --- 3. Table of Contents / Index ---
  const sub = (analysis || {}).submissionInstructions || {};
  const rfp = (analysis || {}).rfpSummary || {};
  const today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  let tocHtml = '<html><head><meta charset="utf-8"><title>Submission Index</title>';
  tocHtml += '<style>body { font-family: Calibri, Arial, sans-serif; color: #334e68; line-height: 1.8; margin: 40px; } h1 { color: #102a43; font-size: 22pt; } h2 { color: #102a43; font-size: 14pt; margin-top: 24px; } table { width: 100%; border-collapse: collapse; margin: 16px 0; } th { background: #102a43; color: white; padding: 8px 12px; text-align: left; font-size: 10pt; } td { padding: 8px 12px; border-bottom: 1px solid #d9e2ec; font-size: 10pt; } tr:nth-child(even) { background: #f8fafc; }</style></head><body>';
  tocHtml += '<h1>Submission Package — Table of Contents</h1>';
  tocHtml += '<p style="color:#627d98;">' + (rfp.title || proposal.title || '') + '</p>';
  tocHtml += '<p style="color:#627d98;font-size:9pt;">Solicitation: ' + (rfp.solicitation || proposal.solicitation || 'N/A') + '</p>';
  tocHtml += '<p style="color:#627d98;font-size:9pt;">Prepared: ' + today + '</p>';
  if (sub.deadline) tocHtml += '<p style="color:#dc2626;font-weight:bold;font-size:10pt;">Submission Deadline: ' + sub.deadline + '</p>';
  tocHtml += '<h2>Included Documents</h2>';
  tocHtml += '<table><tr><th>#</th><th>File Name</th><th>Description</th></tr>';
  tocLines.forEach(t => {
    tocHtml += '<tr><td>' + t.num + '</td><td>' + t.name + '</td><td>' + t.description + '</td></tr>';
  });
  tocHtml += '</table>';

  // List required items not in ZIP
  const requiredForms = analysis.requiredForms || [];
  const assetRequests = (analysis.assetRequests || []).filter(a => a.type !== 'form');
  if (requiredForms.length > 0 || assetRequests.length > 0) {
    tocHtml += '<h2>Additional Items Required (not included)</h2>';
    tocHtml += '<table><tr><th>Item</th><th>Notes</th></tr>';
    requiredForms.forEach(f => {
      tocHtml += '<tr><td>' + (f.formName || f.name || 'Required form') + '</td><td>Complete in original PDF format</td></tr>';
    });
    assetRequests.forEach(a => {
      tocHtml += '<tr><td>' + (a.description || a.name || 'Document') + '</td><td>Prepare separately</td></tr>';
    });
    tocHtml += '</table>';
  }

  if (sub.method) {
    tocHtml += '<h2>Submission Instructions</h2>';
    tocHtml += '<p>' + sub.method + '</p>';
    if (sub.email) tocHtml += '<p>Email: ' + sub.email + '</p>';
    if (sub.portal) tocHtml += '<p>Portal: ' + sub.portal + '</p>';
    if (sub.address) tocHtml += '<p>Address: ' + sub.address.replace(/\n/g, ', ') + '</p>';
  }

  tocHtml += '</body></html>';
  zip.file('00 - Submission Index.doc', '\ufeff' + tocHtml);

  // --- 4. Generate and download ZIP ---
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = proposalTitle + ' - Submission Package.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copyProposalText(proposal) {
  const text = (proposal.sections || []).map(s => {
    const div = document.createElement('div');
    div.innerHTML = s.content || '';
    return '## ' + s.title + '\n\n' + div.textContent;
  }).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).catch(() => {});
}

// ── Vault Setup / Identity ──
function VaultSetup({ onReady }) {
  const [vaultId, setVaultId] = useState('');
  const [loading, setLoading] = useState(false);
  const stored = typeof localStorage !== 'undefined' ? localStorage.getItem(VAULT_STORAGE_KEY) : null;

  useEffect(() => {
    if (stored) onReady(stored);
  }, []);

  if (stored) return null;

  function handleCreate() {
    const id = vaultId.trim() || ('vault_' + Date.now());
    localStorage.setItem(VAULT_STORAGE_KEY, id);
    onReady(id);
  }

  return (
    <div className="max-w-lg mx-auto mt-12 fade-in">
      <div className="bg-white rounded-2xl border border-navy-100 shadow-sm p-6">
        <div className="text-center mb-4">
          <div className="text-3xl mb-2">🔐</div>
          <h3 className="text-lg font-bold text-navy-900">Your Vault</h3>
          <p className="text-sm text-navy-500 mt-1">Your Vault stores company data, certs, and past proposals so every RFP gets faster.</p>
        </div>
        <label className="block text-sm font-medium text-navy-700 mb-1">Company / Vault Name</label>
        <input type="text" value={vaultId} onChange={e => setVaultId(e.target.value)} placeholder="e.g., acme-consulting"
          className="w-full border border-navy-200 rounded-xl px-4 py-3 text-sm mb-3 focus:outline-none" style={{boxShadow:'none'}}
          onKeyDown={e => e.key === 'Enter' && handleCreate()} />
        <button onClick={handleCreate} className="w-full bg-navy-900 hover:bg-navy-800 text-white py-3 rounded-xl font-semibold text-sm">
          {vaultId.trim() ? 'Open Vault' : 'Create New Vault'}
        </button>
        <button onClick={() => onReady('')} className="w-full text-navy-400 hover:text-navy-600 text-sm mt-2 py-2">
          Skip — use without Vault
        </button>
      </div>
    </div>
  );
}

// ── Vault Status Bar ──
function VaultBar({ vault, onManage }) {
  if (!vault || !vault.id) return null;
  return (
    <div className="bg-navy-50 border-b border-navy-100 px-6 py-2">
      <div className="max-w-7xl mx-auto flex items-center justify-between">
        <div className="flex items-center gap-3">
          <span className="text-sm">🔐</span>
          <span className="text-xs font-medium text-navy-700">Vault: {vault.id}</span>
          <span className="text-xs text-navy-400">{vault.docCount} docs · {vault.snippetCount} snippets · {vault.rfpCount} past RFPs</span>
        </div>
        <button onClick={onManage} className="text-xs text-navy-500 hover:text-navy-800 font-medium">Manage Vault</button>
      </div>
    </div>
  );
}

// ── Save to Vault Prompt (shown after proposal completion) ──
const DOC_TYPE_LABELS = {
  vendor_capability: 'Company Info', vendor_summary: 'Company Info',
  certifications: 'Certifications', team_bios: 'Team',
  past_performance: 'Past Performance', prior_proposal: 'Prior Proposal',
  supporting: 'Other', web_content: 'Web Content',
};

function SaveToVaultPrompt({ apiKey, vaultId, documents, analysis, questions, proposal, onSaved, onSkip }) {
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [selectedDocs, setSelectedDocs] = useState(
    () => new Set(documents.filter(d => d.type !== 'rfp' && d.type !== 'rfp_form').map((_, i) => i))
  );

  const vendorDocs = documents.filter(d => d.type !== 'rfp' && d.type !== 'rfp_form');

  async function handleSave() {
    setSaving(true);
    try {
      const docsToSave = vendorDocs.filter((_, i) => selectedDocs.has(i));
      // Save docs and RFP history in parallel
      const promises = [];
      if (docsToSave.length > 0) {
        promises.push(callAI(apiKey, 'vault_save_docs', { vault_id: vaultId, documents: docsToSave }));
      }
      promises.push(callAI(apiKey, 'vault_save_rfp', {
        vault_id: vaultId,
        analysis,
        questions,
        proposal
      }));
      // Extract snippets from answered questions
      const answeredQs = (questions || []).filter(q => q.answer && q.answer.trim() && q.questionType === 'data');
      if (answeredQs.length > 0) {
        const snippets = answeredQs.map(q => ({
          category: q.category || 'custom',
          title: q.question.substring(0, 100),
          content: q.answer,
          source: (analysis.rfpSummary && analysis.rfpSummary.title) || 'RFP Response',
          kept: true
        }));
        promises.push(callAI(apiKey, 'vault_save_snippets', { vault_id: vaultId, snippets }));
      }
      await Promise.all(promises);
      setSaved(true);
      setTimeout(() => onSaved(), 1500);
    } catch (e) {
      console.error('Vault save error:', e);
      setSaving(false);
    }
  }

  function toggleDoc(i) {
    setSelectedDocs(prev => {
      const n = new Set(prev);
      n.has(i) ? n.delete(i) : n.add(i);
      return n;
    });
  }

  if (saved) return (
    <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6 fade-in text-center">
      <p className="text-sm font-medium text-emerald-800">✅ Saved to Vault! Your next RFP will be even faster.</p>
    </div>
  );

  return (
    <div className="bg-gold-400/10 border border-gold-400/30 rounded-xl p-5 mb-6 fade-in">
      <div className="flex items-start gap-3 mb-3">
        <span className="text-2xl">🔐</span>
        <div>
          <h4 className="font-semibold text-navy-900">Save to Your Vault?</h4>
          <p className="text-sm text-navy-600 mt-1">Store your documents, answers, and this proposal so future RFPs auto-populate with your data.</p>
        </div>
      </div>
      {vendorDocs.length > 0 ? (
        <div className="mb-3">
          <p className="text-xs font-semibold text-navy-600 mb-2">Documents to save:</p>
          <div className="space-y-1">
            {vendorDocs.map((d, i) => (
              <label key={i} className="flex items-center gap-2 text-sm text-navy-700 cursor-pointer">
                <input type="checkbox" checked={selectedDocs.has(i)} onChange={() => toggleDoc(i)} className="w-3.5 h-3.5" />
                <span>{d.name}</span>
                <span className="text-xs text-navy-400">({DOC_TYPE_LABELS[d.type] || d.type})</span>
              </label>
            ))}
          </div>
        </div>
      ) : null}
      <div className="flex gap-2">
        <button onClick={handleSave} disabled={saving} className="bg-navy-900 hover:bg-navy-800 text-white px-5 py-2 rounded-lg text-sm font-medium disabled:opacity-50">
          {saving ? 'Saving...' : 'Save to Vault'}
        </button>
        <button onClick={onSkip} className="text-navy-500 hover:text-navy-700 text-sm font-medium px-4 py-2">Skip</button>
      </div>
    </div>
  );
}

// ── Main App ──
const DEFAULT_API_KEY = ''; // Enter key in UI or set here for local dev

function App() {
  const [apiKey, setApiKey] = useState(DEFAULT_API_KEY);
  const [step, setStep] = useState(1);
  const [maxStep, setMaxStep] = useState(1);
  const [docs, setDocs] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [questionsData, setQuestionsData] = useState(null);
  const [proposalData, setProposalData] = useState(null);
  // Vault state
  const [vaultId, setVaultId] = useState(null); // null = not initialized, '' = skipped
  const [vault, setVault] = useState({ id: '', docCount: 0, snippetCount: 0, rfpCount: 0, documents: [], snippets: [] });
  const [vaultSaved, setVaultSaved] = useState(false);
  const [showVault, setShowVault] = useState(false);
  const [vaultLoadKey, setVaultLoadKey] = useState(0); // increment to force reload

  function goToStep(n) {
    setStep(n);
    setMaxStep(prev => Math.max(prev, n));
  }

  function handleStepClick(newStep) {
    if (newStep <= maxStep && newStep !== step) setStep(newStep);
  }

  function handleQuestionsComplete(qs) {
    setQuestionsData(qs);
    setProposalData(null);
    setVaultSaved(false);
    goToStep(4);
  }

  // Load vault when vaultId is set
  useEffect(() => {
    if (!vaultId || !apiKey) return;
    callAI(apiKey, 'vault_load', { vault_id: vaultId })
      .then(data => {
        setVault({
          id: vaultId,
          docCount: (data.documents || []).length,
          snippetCount: (data.snippets || []).length,
          rfpCount: (data.rfpHistory || []).length,
          documents: data.documents || [],
          snippets: data.snippets || [],
          rfpHistory: data.rfpHistory || [],
          profile: data.profile,
        });
        // Load full text for vault docs so they can be sent to Q&A
        if (data.documents && data.documents.length > 0) {
          callAI(apiKey, 'vault_get_doc_texts', { vault_id: vaultId })
            .then(texts => {
              setVault(prev => ({ ...prev, documentTexts: texts || [] }));
            })
            .catch(() => {});
        }
      })
      .catch(e => console.error('Vault load error:', e));
  }, [vaultId, apiKey, vaultLoadKey]);

  function reloadVault() {
    setVaultLoadKey(prev => prev + 1);
  }

  function handleVaultReady(id) {
    setVaultId(id || '');
  }

  if (!apiKey) return <><Header step={0} maxStep={0} onStepClick={handleStepClick}/><ApiKeySetup onReady={setApiKey}/></>;
  if (vaultId === null) return <><Header step={0} maxStep={0} onStepClick={handleStepClick}/><VaultSetup onReady={handleVaultReady}/></>;

  // Merge vault docs into vendor content for Q&A
  const vaultVendorDocs = (vault.documentTexts || []).map(d => ({
    name: '[Vault] ' + d.name,
    type: d.doc_type,
    text: d.full_text || ''
  }));

  return (
    <div className="min-h-screen flex flex-col">
      <Header step={step} maxStep={maxStep} onStepClick={handleStepClick}/>
      <VaultBar vault={vault} onManage={() => setShowVault(!showVault)} />
      {showVault ? (
        <div className="bg-white border-b border-navy-100 shadow-sm">
          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold text-navy-900">🔐 Vault: {vault.id}</h3>
              <button onClick={() => setShowVault(false)} className="text-navy-400 hover:text-navy-700 text-sm font-medium">Close ✕</button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div>
                <h4 className="text-sm font-semibold text-navy-700 mb-2">Documents ({vault.docCount})</h4>
                {vault.documents.length > 0 ? (
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {vault.documents.map(d => (
                      <div key={d.id} className="flex items-center gap-2 text-sm bg-navy-50 rounded-lg px-3 py-2">
                        <span className="text-xs">{d.doc_type === 'certifications' ? '📜' : d.doc_type === 'team_bios' ? '👤' : d.doc_type === 'past_performance' ? '📊' : '📄'}</span>
                        <div className="flex-1 min-w-0">
                          <p className="text-navy-800 truncate text-xs font-medium">{d.name}</p>
                          <p className="text-navy-400 text-xs">{d.category || d.doc_type}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : <p className="text-xs text-navy-400">No documents yet. Complete an RFP and save to Vault.</p>}
              </div>
              <div>
                <h4 className="text-sm font-semibold text-navy-700 mb-2">Answer Snippets ({vault.snippetCount})</h4>
                {(vault.snippets || []).length > 0 ? (
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {(vault.snippets || []).slice(0, 10).map(s => (
                      <div key={s.id} className="bg-navy-50 rounded-lg px-3 py-2">
                        <p className="text-xs font-medium text-navy-800 truncate">{s.title}</p>
                        <p className="text-xs text-navy-400 mt-0.5">Used {s.times_used}x · Kept {s.times_kept}x · {s.category}</p>
                      </div>
                    ))}
                  </div>
                ) : <p className="text-xs text-navy-400">No snippets yet. Answers from completed RFPs appear here.</p>}
              </div>
              <div>
                <h4 className="text-sm font-semibold text-navy-700 mb-2">Past RFPs ({vault.rfpCount})</h4>
                {(vault.rfpHistory || []).length > 0 ? (
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {(vault.rfpHistory || []).map(r => (
                      <div key={r.id} className="bg-navy-50 rounded-lg px-3 py-2">
                        <p className="text-xs font-medium text-navy-800 truncate">{r.rfp_title}</p>
                        <p className="text-xs text-navy-400 mt-0.5">{r.agency} · {r.status}</p>
                      </div>
                    ))}
                  </div>
                ) : <p className="text-xs text-navy-400">No RFPs saved yet. Complete a proposal and save to Vault.</p>}
              </div>
            </div>
            <div className="mt-4 pt-3 border-t border-navy-100 flex gap-3">
              <button onClick={() => { localStorage.removeItem(VAULT_STORAGE_KEY); setVaultId(null); setShowVault(false); }} className="text-xs text-red-500 hover:text-red-700 font-medium">Switch Vault</button>
              <button onClick={reloadVault} className="text-xs text-navy-500 hover:text-navy-700 font-medium">Refresh</button>
            </div>
          </div>
        </div>
      ) : null}
      <main className="flex-1 px-6 py-8">
        {step===1 && <DocumentIntake apiKey={apiKey} initialDocs={docs} onComplete={(d, reanalyze)=>{setDocs(d); if(reanalyze){setAnalysis(null);setQuestionsData(null);setProposalData(null);setVaultSaved(false);} goToStep(2);}}/>}
        {step===2 && <AnalysisView apiKey={apiKey} documents={docs} initialAnalysis={analysis} onComplete={a=>{setAnalysis(a);goToStep(3);}} onBack={() => setStep(1)}/>}
        {step===3 && <QuestionsFlow apiKey={apiKey} analysis={analysis} documents={[...docs, ...vaultVendorDocs]} priorProposals={docs.filter(d=>d.type==='prior_proposal')} vaultSnippets={vault.snippets || []} initialQuestions={questionsData} onComplete={handleQuestionsComplete} onBack={() => setStep(2)}/>}
        {step===4 && (
          <>
            {vaultId && !vaultSaved && proposalData ? (
              <SaveToVaultPrompt
                apiKey={apiKey} vaultId={vaultId} documents={docs}
                analysis={analysis} questions={questionsData} proposal={proposalData}
                onSaved={() => { setVaultSaved(true); reloadVault(); }} onSkip={() => setVaultSaved(true)}
              />
            ) : null}
            <ProposalView apiKey={apiKey} analysis={analysis} answers={questionsData||[]} priorProposals={docs.filter(d=>d.type==='prior_proposal')} allDocuments={[...docs, ...vaultVendorDocs]} initialProposal={proposalData} onProposalReady={setProposalData} onBack={() => setStep(3)} onAssemble={() => goToStep(5)}/>
          </>
        )}
        {step===5 && proposalData && (
          <SubmissionBuilder proposal={proposalData} analysis={analysis} answers={questionsData||[]} allDocuments={[...docs, ...vaultVendorDocs]} onBack={() => setStep(4)}/>
        )}
      </main>
      <footer className="border-t border-navy-100 bg-white/80 py-4 px-6">
        <div className="max-w-7xl mx-auto flex justify-between text-xs text-navy-400">
          <span>ProposalAI — Government RFP Response Engine</span>
          <span>v1.0 — Powered by Claude AI</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
